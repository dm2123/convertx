<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Protect — ConvertX</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080b14;
    color:#fff;
}

.wrap{
    width:min(850px,92%);
    margin:35px auto;
}

.back{
    color:#aeb7ca;
    text-decoration:none;
}

.header{
    text-align:center;
    margin:30px 0;
}

.logo{
    font-size:34px;
    font-weight:800;
}

.logo span{
    color:#8b6cff;
}

.subtitle{
    color:#9da5b8;
    margin-top:8px;
}

.card{
    background:#111624;
    border:1px solid #273149;
    border-radius:22px;
    padding:28px;
    box-shadow:0 20px 60px #0006;
}

.drop{
    border:2px dashed #3a4560;
    border-radius:18px;
    padding:45px 20px;
    text-align:center;
    cursor:pointer;
}

.drop:hover{
    border-color:#8b6cff;
    background:#8b6cff12;
}

.icon{
    font-size:55px;
}

input[type=file]{
    display:none;
}

button{
    border:0;
    border-radius:11px;
    padding:13px 20px;
    font-weight:700;
    cursor:pointer;
}

.primary{
    background:#8b6cff;
    color:white;
}

.secondary{
    background:#252d40;
    color:white;
}

.file{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#0b101c;
    border:1px solid #29344b;
}

.form{
    margin-top:20px;
    display:none;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#b8c1d3;
}

input[type=password]{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #303a52;
    background:#090e19;
    color:#fff;
    outline:none;
}

input[type=password]:focus{
    border-color:#8b6cff;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.actions button{
    flex:1;
}

.status{
    margin-top:18px;
    padding:13px;
    background:#0b101c;
    border-radius:10px;
    color:#aeb7ca;
    text-align:center;
}

.warn{
    margin-top:15px;
    color:#f3c77b;
    font-size:13px;
    line-height:1.5;
}

@media(max-width:600px){
    .card{padding:18px}
    .actions{flex-direction:column}
}
</style>
</head>

<body>

<div class="wrap">

<a class="back" href="index.html">← Back to ConvertX</a>

<div class="header">
    <div class="logo">
        Convert<span>X</span>
    </div>

    <div class="subtitle">
        Protect PDF with real password encryption
    </div>
</div>

<div class="card">

    <div class="drop" id="drop">
        <div class="icon">🔐</div>

        <h2>Select PDF</h2>

        <p>
            Choose a PDF file to encrypt
        </p>

        <button
            class="primary"
            id="choose"
            type="button">
            Choose PDF
        </button>

        <input
            id="file"
            type="file"
            accept="application/pdf">
    </div>

    <div
        class="file"
        id="fileInfo">
    </div>

    <div
        class="form"
        id="form">

        <label for="password">
            User Password
        </label>

        <input
            id="password"
            type="password"
            autocomplete="new-password"
            placeholder="Enter PDF password">

        <label for="confirm">
            Confirm Password
        </label>

        <input
            id="confirm"
            type="password"
            autocomplete="new-password"
            placeholder="Confirm password">

        <div class="actions">

            <button
                class="secondary"
                id="clear"
                type="button">
                Clear
            </button>

            <button
                class="primary"
                id="protect"
                type="button">
                🔐 Protect PDF
            </button>

        </div>

        <div class="warn">
            Your selected PDF is processed in the browser.
            The password is not sent to ConvertX's server.
        </div>

    </div>

    <div
        class="status"
        id="status">
        Select a PDF to begin.
    </div>

</div>

</div>


<!--
IMPORTANT:
This page expects the qpdf-run browser runtime to be available
under /qpdf/ in your GitHub Pages repository.
-->

<script type="module">

import {
    createQpdfRunner
} from "/convertx/qpdf/qpdf-run.js";


const fileInput =
    document.getElementById("file");

const choose =
    document.getElementById("choose");

const drop =
    document.getElementById("drop");

const fileInfo =
    document.getElementById("fileInfo");

const form =
    document.getElementById("form");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirm");

const protect =
    document.getElementById("protect");

const clear =
    document.getElementById("clear");

const status =
    document.getElementById("status");


let selectedFile = null;
let runner = null;


choose.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    () => {

        if(fileInput.files.length){

            setFile(
                fileInput.files[0]
            );

        }

    }
);


drop.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        drop.style.borderColor =
            "#8b6cff";

    }
);


drop.addEventListener(
    "dragleave",
    () => {

        drop.style.borderColor =
            "";

    }
);


drop.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        drop.style.borderColor =
            "";

        const file =
            event.dataTransfer.files[0];

        if(
            file &&
            file.type ===
            "application/pdf"
        ){

            setFile(file);

        }

    }
);


function setFile(file){

    if(
        file.type !==
        "application/pdf"
    ){

        status.textContent =
            "Please select a PDF file.";

        return;

    }

    selectedFile = file;

    fileInfo.style.display =
        "block";

    fileInfo.textContent =
        "📄 " +
        file.name +
        " • " +
        formatSize(file.size);

    form.style.display =
        "block";

    status.textContent =
        "PDF ready for protection.";

}


function formatSize(bytes){

    if(bytes < 1024)
        return bytes + " B";

    if(bytes < 1024*1024)
        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    return (
        bytes /
        (1024*1024)
    ).toFixed(1) + " MB";

}


clear.addEventListener(
    "click",
    () => {

        selectedFile = null;

        fileInput.value = "";

        password.value = "";

        confirmPassword.value = "";

        fileInfo.style.display =
            "none";

        form.style.display =
            "none";

        status.textContent =
            "Select a PDF to begin.";

    }
);


async function getRunner(){

    if(runner)
        return runner;

    status.textContent =
        "Loading PDF encryption engine...";

    runner =
        await createQpdfRunner({
            assetBaseUrl:
                "/convertx/qpdf/"
        });

    return runner;

}


protect.addEventListener(
    "click",
    async () => {

        if(!selectedFile){

            status.textContent =
                "Please select a PDF first.";

            return;

        }

        const pass =
            password.value;

        const confirm =
            confirmPassword.value;


        if(!pass){

            status.textContent =
                "Please enter a password.";

            password.focus();

            return;

        }


        if(pass.length < 6){

            status.textContent =
                "Use a password of at least 6 characters.";

            password.focus();

            return;

        }


        if(pass !== confirm){

            status.textContent =
                "Passwords do not match.";

            confirmPassword.focus();

            return;

        }


        protect.disabled = true;

        protect.textContent =
            "Encrypting...";


        try{

            const inputBytes =
                new Uint8Array(
                    await selectedFile.arrayBuffer()
                );


            const qpdf =
                await getRunner();


            /*
             * Real PDF encryption.
             *
             * 256-bit encryption is used.
             * User password is required to open
             * the resulting PDF.
             */

            const result =
                await qpdf.run({

                    inputs:{
                        "input.pdf":
                            inputBytes
                    },

                    args:[
                        "--encrypt",
                        pass,
                        pass,
                        "256",
                        "--",
                        "input.pdf",
                        "protected.pdf"
                    ],

                    outputs:[
                        "protected.pdf"
                    ]

                });


            const output =
                result.outputs[
                    "protected.pdf"
                ];


            const blob =
                new Blob(
                    [output],
                    {
                        type:
                        "application/pdf"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                selectedFile.name
                    .replace(
                        /\.pdf$/i,
                        ""
                    ) +
                "-protected.pdf";

            document.body.appendChild(a);

            a.click();

            a.remove();

            setTimeout(
                () => URL.revokeObjectURL(url),
                1000
            );


            status.textContent =
                "✅ Protected PDF created successfully.";

        }
        catch(error){

            console.error(error);

            status.textContent =
                "❌ Encryption failed: " +
                (
                    error?.message ||
                    "Unknown error"
                );

        }
        finally{

            protect.disabled = false;

            protect.textContent =
                "🔐 Protect PDF";

        }

    }
);

</script>

</body>
</html>
