<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta
name="description"
content="Extract images from PDF files with ConvertX.">

<title>PDF Images Extractor - ConvertX</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#06070d;
 color:#fff;
 font-family:Inter,Arial,sans-serif;
}

.container{
 width:min(1150px,92%);
 margin:auto;
}

.nav{
 margin:20px 0;
 padding:15px 18px;
 border:1px solid #ffffff14;
 border-radius:20px;
 background:#ffffff06;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:#fff;
 text-decoration:none;
 font-size:21px;
 font-weight:900;
}

.back{
 color:#8d91a3;
 text-decoration:none;
 font-size:13px;
}

.hero{
 text-align:center;
 padding:55px 0 38px;
}

.badge{
 display:inline-block;
 padding:8px 13px;
 border-radius:999px;
 background:#ffb02012;
 border:1px solid #ffb02030;
 color:#ffd47d;
 font-size:11px;
 font-weight:800;
}

h1{
 margin:20px 0 12px;
 font-size:clamp(40px,7vw,70px);
 letter-spacing:-4px;
}

.gradient{
 color:#ffb020;
}

.subtitle{
 max-width:720px;
 margin:auto;
 color:#8d91a3;
 line-height:1.7;
}

.tool{
 padding:14px;
 border:1px solid #ffffff14;
 border-radius:27px;
 background:#ffffff05;
}

.upload{
 min-height:300px;
 border:2px dashed #ffffff22;
 border-radius:20px;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 cursor:pointer;
}

.upload:hover{
 border-color:#ffb020;
 background:#ffb02007;
}

.upload-icon{
 font-size:52px;
 margin-bottom:10px;
}

.upload h2{
 margin:6px 0;
}

.upload p{
 color:#777c90;
 font-size:13px;
}

.primary{
 border:0;
 border-radius:11px;
 padding:13px 20px;
 background:linear-gradient(
  135deg,
  #ffb020,
  #ff7043
 );
 color:#fff;
 font-weight:800;
 cursor:pointer;
}

.secondary{
 border:1px solid #ffffff16;
 border-radius:11px;
 padding:12px 18px;
 background:#ffffff07;
 color:#fff;
 cursor:pointer;
 font-weight:700;
}

input[type=file]{
 display:none;
}

.workspace{
 display:none;
 margin-top:18px;
}

.toolbar{
 display:flex;
 flex-wrap:wrap;
 gap:9px;
 padding:15px;
 border:1px solid #ffffff14;
 border-radius:17px;
 background:#ffffff04;
}

.info{
 flex:1;
 min-width:180px;
}

.filename{
 font-size:13px;
 font-weight:800;
}

.status{
 color:#858a9d;
 font-size:11px;
 margin-top:5px;
}

.results{
 margin-top:17px;
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(250px,1fr));
 gap:15px;
}

.card{
 padding:12px;
 border:1px solid #ffffff14;
 border-radius:18px;
 background:#ffffff05;
 overflow:hidden;
}

.preview{
 width:100%;
 min-height:180px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:12px;
 background:
 linear-gradient(45deg,#ddd 25%,transparent 25%),
 linear-gradient(-45deg,#ddd 25%,transparent 25%),
 linear-gradient(45deg,transparent 75%,#ddd 75%),
 linear-gradient(-45deg,transparent 75%,#ddd 75%);
 background-size:24px 24px;
 background-position:
 0 0,0 12px,12px -12px,-12px 0;
 overflow:hidden;
}

.preview img{
 max-width:100%;
 max-height:300px;
 display:block;
}

.card-info{
 padding:12px 2px 5px;
}

.card-title{
 font-weight:800;
 font-size:13px;
}

.card-meta{
 color:#777c90;
 font-size:11px;
 margin-top:5px;
}

.card button{
 width:100%;
 margin-top:10px;
}

.empty{
 padding:50px;
 text-align:center;
 color:#666b7c;
 border:1px dashed #ffffff16;
 border-radius:18px;
 grid-column:1/-1;
}

@media(max-width:650px){

 .toolbar{
  display:grid;
  grid-template-columns:1fr 1fr;
 }

 .info{
  grid-column:1/-1;
 }

 h1{
  letter-spacing:-3px;
 }

}

</style>
</head>

<body>

<div class="container">

<header class="nav">

<a href="index.html" class="logo">
↻ ConvertX
</a>

<a href="index.html" class="back">
← All Tools
</a>

</header>


<section class="hero">

<span class="badge">
PDF IMAGE TOOL
</span>

<h1>
Extract <span class="gradient">Images</span>
</h1>

<p class="subtitle">
Find images contained inside PDF pages and
export them as individual image files.
</p>

</section>


<div class="tool">

<div class="upload" id="upload">

<div>

<div class="upload-icon">
🖼️
</div>

<h2>
Drop your PDF here
</h2>

<p>
The PDF is processed inside your browser.
</p>

<button
class="primary"
id="choose">
Choose PDF
</button>

</div>

</div>


<input
type="file"
id="file"
accept="application/pdf"
>


<div
class="workspace"
id="workspace">


<div class="toolbar">

<div class="info">

<div
class="filename"
id="filename">
</div>

<div
class="status"
id="status">
</div>

</div>

<button
class="secondary"
id="extract">
Extract Images
</button>

<button
class="secondary"
id="clear">
Clear
</button>

</div>


<div
class="results"
id="results">

<div class="empty">
No extracted images yet.
</div>

</div>


</div>

</div>

</div>


<script type="module">


import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


const upload=
document.getElementById("upload");

const choose=
document.getElementById("choose");

const fileInput=
document.getElementById("file");

const workspace=
document.getElementById("workspace");

const filename=
document.getElementById("filename");

const status=
document.getElementById("status");

const extract=
document.getElementById("extract");

const clear=
document.getElementById("clear");

const results=
document.getElementById("results");


let selectedFile=null;


choose.onclick=function(e){

 e.stopPropagation();

 fileInput.click();

};


upload.onclick=function(){

 fileInput.click();

};


fileInput.onchange=function(){

 if(this.files[0]){

  selectedFile=
  this.files[0];

  filename.textContent=
  selectedFile.name;

  workspace.style.display=
  "block";

  results.innerHTML=
  '<div class="empty">Ready to extract images.</div>';

  status.textContent=
  "PDF selected.";

 }

};


extract.onclick=
async function(){

 if(!selectedFile){

  alert("Please select a PDF.");

  return;

 }


 extract.disabled=true;

 extract.textContent=
 "Extracting...";

 results.innerHTML="";

 status.textContent=
 "Opening PDF...";


 try{

  const buffer=
  await selectedFile.arrayBuffer();


  const pdf=
  await pdfjsLib
  .getDocument({
   data:buffer
  })
  .promise;


  let imageCount=0;


  for(
   let pageNo=1;
   pageNo<=pdf.numPages;
   pageNo++
  ){

   status.textContent=
   "Scanning page "+
   pageNo+
   " of "+
   pdf.numPages;


   const page=
   await pdf.getPage(
    pageNo
   );


   const operatorList=
   await page.getOperatorList();


   for(
    let i=0;
    i<operatorList.fnArray.length;
    i++
   ){

    const fn=
    operatorList.fnArray[i];

    if(
     fn!==pdfjsLib
     .OPS.paintImageXObject &&
     fn!==pdfjsLib
     .OPS.paintImageMaskXObject &&
     fn!==pdfjsLib
     .OPS.paintJpegXObject
    ){

     continue;

    }


    const args=
    operatorList.argsArray[i];


    let imageName=null;


    if(args){

     imageName=
     args[0];

    }


    if(!imageName){

     continue;

    }


    try{

     const image=
     await page.objs
     .get(imageName);


     if(!image){

      continue;

     }


     const canvas=
     document.createElement(
      "canvas"
     );


     let width=
     image.width;

     let height=
     image.height;


     if(
      !width ||
      !height
     ){

      continue;

     }


     canvas.width=
     width;

     canvas.height=
     height;


     const ctx=
     canvas.getContext(
      "2d"
     );


     let imageData=null;


     if(
      image.bitmap
     ){

      ctx.drawImage(
       image.bitmap,
       0,
       0
      );

     }

     else if(
      image.data
     ){

      imageData=
      image.data;

      const img=
      ctx.createImageData(
       width,
       height
      );


      if(
       imageData.length===
       width*height*4
      ){

       img.data.set(
        imageData
       );

      }

      else if(
       imageData.length===
       width*height*3
      ){

       let source=0;

       for(
        let p=0;
        p<img.data.length;
        p+=4
       ){

        img.data[p]=
        imageData[source++];

        img.data[p+1]=
        imageData[source++];

        img.data[p+2]=
        imageData[source++];

        img.data[p+3]=255;

       }

      }

      else{

       continue;

      }


      ctx.putImageData(
       img,
       0,
       0
      );

     }

     else{

      continue;

     }


     const blob=
     await canvasToBlob(
      canvas
     );


     if(!blob){

      continue;

     }


     imageCount++;


     createCard(
      blob,
      canvas,
      pageNo,
      imageCount
     );


    }catch(imageError){

     console.warn(
      "Image extraction skipped:",
      imageError
     );

    }

   }

  }


  if(imageCount===0){

   results.innerHTML=
   '<div class="empty">'+
   'No directly extractable images were found. '+
   'Some PDFs contain page content as vector graphics or flattened pages.'+
   '</div>';

   status.textContent=
   "No embedded raster images found.";

  }

  else{

   status.textContent=
   "✓ Found "+
   imageCount+
   " image(s).";

  }


 }catch(error){

  console.error(error);

  status.textContent=
  "Unable to read this PDF.";

  results.innerHTML=
  '<div class="empty">PDF processing failed.</div>';

 }


 extract.disabled=false;

 extract.textContent=
 "Extract Images";

};


function canvasToBlob(canvas){

 return new Promise(
  function(resolve){

   canvas.toBlob(
    function(blob){

     resolve(blob);

    },
    "image/png"
   );

  }
 );

}


function createCard(
 blob,
 canvas,
 pageNo,
 imageNo
){

 const url=
 URL.createObjectURL(blob);


 const card=
 document.createElement(
  "div"
 );

 card.className="card";


 const preview=
 document.createElement(
  "div"
 );

 preview.className="preview";


 const img=
 document.createElement(
  "img"
 );

 img.src=url;

 img.alt=
 "Extracted image "+imageNo;


 preview.appendChild(img);


 const info=
 document.createElement(
  "div"
 );

 info.className=
 "card-info";


 const title=
 document.createElement(
  "div"
 );

 title.className=
 "card-title";

 title.textContent=
 "Image "+imageNo;


 const meta=
 document.createElement(
  "div"
 );

 meta.className=
 "card-meta";

 meta.textContent=
 "From page "+
 pageNo+
 " • "+
 canvas.width+
 " × "+
 canvas.height+
 " px";


 const button=
 document.createElement(
  "button"
 );

 button.className=
 "primary";

 button.textContent=
 "⬇ Download PNG";


 button.onclick=function(){

  const a=
  document.createElement(
   "a"
  );

  a.href=url;

  a.download=
  "extracted-image-"+
  imageNo+
  ".png";

  document.body.appendChild(a);

  a.click();

  a.remove();

 };


 info.appendChild(title);

 info.appendChild(meta);

 info.appendChild(button);

 card.appendChild(preview);

 card.appendChild(info);

 results.appendChild(card);

}


clear.onclick=function(){

 selectedFile=null;

 fileInput.value="";

 workspace.style.display=
 "none";

 results.innerHTML="";

 status.textContent="";

};

</script>

</body>
</html>
