<body>

<div class="container">

<a class="back" href="index.html">
← Back to ConvertX
</a>

<h1>🗜️ Image Compressor</h1>

<div class="subtitle">
Reduce image file size while keeping good visual quality.
</div>

<div class="card">

<div class="drop" id="drop">

<div class="icon">🖼️</div>

<h2>Select Image</h2>

<p>JPG, JPEG, PNG or WebP</p>

<button
class="primary"
id="choose"
type="button">
Choose Image
</button>

id="file"
type="file"
accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp">

</div>


<div class="file" id="fileInfo"></div>

<img id="previewImage" alt="Preview">

</div>

<div>

<label>
Output Format
</label>

JPG
</option>

WebP
</option>

PNG
</option>

</select>

</div>


<div>

<label>
Maximum Width
</label>

<input
id="maxWidth"
type="number"
min="100"

</div>

</div>

<label>
Quality:

80
</span>%
</label>

>

</div>

</button>

🗜️ Compress & Download
</button>

</div>

Original
<br>
<strong id="originalSize">
-
</strong>
</div>

<div class="box">
Compressed
<br>
<strong id="newSize">
-
</strong>
</div>

</div>

class="status"
id="status">
Select an image.
</div>

</div>

<script>

const fileInput=
document.getElementById("file");

const choose=
document.getElementById("choose");

const drop=
document.getElementById("drop");

const quality=
document.getElementById("quality");

const qualityText=
document.getElementById("qualityText");

const format=
document.getElementById("format");

const maxWidth=
document.getElementById("maxWidth");

const compress=
document.getElementById("compress");

const reset=
document.getElementById("reset");

const status=
document.getElementById("status");

const fileInfo=
document.getElementById("fileInfo");

const preview=
document.getElementById("preview");

const previewImage=
document.getElementById("previewImage");

const originalSize=
document.getElementById("originalSize");

const newSize=
document.getElementById("newSize");


let selectedFile=null;


/* Picker */

choose.onclick=()=>{
fileInput.click();
};


/* Quality */

quality.oninput=()=>{
qualityText.textContent=
quality.value;
};


/* File */

fileInput.onchange=()=>{

if(fileInput.files.length){

loadFile(
fileInput.files[0]
);

}

};


/* Drag */

drop.ondragover=e=>{

e.preventDefault();

drop.classList.add("drag");

};

drop.ondragleave=()=>{

drop.classList.remove("drag");

};

drop.ondrop=e=>{

e.preventDefault();

drop.classList.remove("drag");

if(e.dataTransfer.files.length){

loadFile(
e.dataTransfer.files[0]
);

}

};


/* Load */

function loadFile(file){

if(
!file.type.startsWith("image/")
){

showError(
"Please select a valid image."
);

return;

}

selectedFile=file;


fileInfo.style.display=
"block";

fileInfo.innerHTML=
`
<strong>${escapeHTML(file.name)}</strong>
<br>
${file.type}
<br>
${formatBytes(file.size)}
`;


originalSize.textContent=
formatBytes(file.size);

newSize.textContent="-";


const url=
URL.createObjectURL(file);

previewImage.onload=()=>{
URL.revokeObjectURL(url);
};

previewImage.src=url;

preview.style.display=
"block";

showStatus(
"Image ready for compression."
);

}


/* Compress */

compress.onclick=async()=>{

if(!selectedFile){

showError(
"Please select an image first."
);

return;

}

compress.disabled=true;

showStatus(
"Compressing image..."
);

try{

const bitmap=
await createImageBitmap(
selectedFile
);


let width=
bitmap.width;

let height=
bitmap.height;


/* Optional resize */

const requestedWidth=
parseInt(
maxWidth.value,
10
);

if(
Number.isFinite(requestedWidth) &&
requestedWidth>0 &&
requestedWidth<width
){

height=
Math.round(
height *
requestedWidth /
width
);

width=
requestedWidth;

}


/* Canvas */

const canvas=
document.createElement(
"canvas"
);

canvas.width=width;
canvas.height=height;


const ctx=
canvas.getContext(
"2d"
);


/* JPG needs white background */

const outputType=
format.value;

if(
outputType==="image/jpeg"
){

ctx.fillStyle="#ffffff";

ctx.fillRect(
0,
0,
width,
height
);

}


ctx.drawImage(
bitmap,
0,
0,
width,
height
);


/* Quality */

const q=
Number(quality.value)/100;


/* Encode */

const blob=
await new Promise(
resolve=>{

canvas.toBlob(
resolve,
outputType,
q
);

}
);


if(!blob){

throw new Error(
"Browser could not create the compressed image."
);

}


newSize.textContent=
formatBytes(blob.size);


/* Download */

let extension="jpg";

if(outputType==="image/png"){
extension="png";
}

if(outputType==="image/webp"){
extension="webp";
}


const base=
selectedFile.name
.replace(/\.[^.]+$/,"");


download(
blob,
`${base}-compressed.${extension}`
);


const saved=
selectedFile.size -
blob.size;


if(saved>0){

showSuccess(
`Compression complete. Saved ${formatBytes(saved)}.`
);

}
else{

showStatus(
`Converted successfully. New file size: ${formatBytes(blob.size)}`
);

}

}
catch(error){

console.error(error);

showError(
"Compression failed: "+
error.message
);

}
finally{

compress.disabled=false;

}

};


/* Reset */

reset.onclick=()=>{

selectedFile=null;

fileInput.value="";

fileInfo.style.display="none";

preview.style.display="none";

originalSize.textContent="-";

newSize.textContent="-";

quality.value=80;

qualityText.textContent="80";

maxWidth.value="";

format.value="image/jpeg";

showStatus(
"Select an image."
);

};


/* Download */

function download(blob,name){

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download=name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
3000
);

}


/* Bytes */

function formatBytes(bytes){

if(bytes<1024){

return bytes+" B";

}

if(bytes<1024*1024){

return (
bytes/1024
).toFixed(1)+" KB";

}

return (
bytes/1024/1024
).toFixed(2)+" MB";

}


/* HTML escape */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* Status */

function showStatus(message){

status.className="status";

status.textContent=message;

}


function showSuccess(message){

status.className=
"status success";

status.textContent=
"✅ "+message;

}


function showError(message){

status.className=
"status error";

status.textContent=
"❌ "+message;

}

</script>

</body>
</html>
