name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: ConvertX-Windows.zip
          - os: macos-latest
            script: build:mac
            artifact: ConvertX-macOS.dmg
          - os: ubuntu-latest
            script: build:linux
            artifact: ConvertX-Linux.AppImage
    runs-on: ${{ matrix.os }}
    env:
      VITE_API_URL: https://convertx-api-libre.onrender.com
      VITE_ADSENSE_CLIENT: ca-pub-1547520859488681
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend to desktop
        run: |
          Copy-Item -Path frontend/dist -Destination desktop/dist -Recurse -Force
        if: runner.os == 'Windows'

      - name: Copy frontend to desktop
        run: |
          cp -r frontend/dist desktop/dist
        if: runner.os != 'Windows'

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build ${{ matrix.os }}
        working-directory: desktop
        run: npm run ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true