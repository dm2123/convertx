<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<meta
name="description"
content="Extract text from PDF files online with ConvertX.">

<title>PDF to Text - ConvertX</title>


<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#06070d;
 color:#fff;
 font-family:Inter,Arial,sans-serif;
}

.container{
 width:min(1100px,92%);
 margin:auto;
}

.nav{
 margin:20px 0;
 padding:15px 18px;
 border:1px solid #ffffff14;
 border-radius:20px;
 background:#ffffff06;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:#fff;
 text-decoration:none;
 font-size:21px;
 font-weight:900;
}

.back{
 color:#8d91a3;
 text-decoration:none;
 font-size:13px;
}

.hero{
 text-align:center;
 padding:55px 0 40px;
}

.badge{
 display:inline-block;
 padding:8px 13px;
 border-radius:999px;
 background:#35a9ff10;
 border:1px solid #35a9ff30;
 color:#8ed4ff;
 font-size:11px;
 font-weight:800;
}

h1{
 margin:20px 0 12px;
 font-size:clamp(42px,7vw,70px);
 letter-spacing:-4px;
}

.gradient{
 color:#35a9ff;
}

.subtitle{
 color:#8d91a3;
 line-height:1.7;
 max-width:700px;
 margin:auto;
}

.tool{
 padding:14px;
 border:1px solid #ffffff14;
 border-radius:26px;
 background:#ffffff05;
}

.upload{
 min-height:300px;
 border:2px dashed #ffffff22;
 border-radius:20px;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 cursor:pointer;
}

.upload:hover{
 border-color:#35a9ff;
 background:#35a9ff07;
}

.upload-inner{
 padding:30px;
}

.upload-icon{
 font-size:50px;
 margin-bottom:12px;
}

.upload h2{
 margin:5px 0 8px;
}

.upload p{
 color:#777c90;
 font-size:13px;
}

.primary{
 border:0;
 border-radius:11px;
 padding:13px 20px;
 background:linear-gradient(
  135deg,
  #35a9ff,
  #7468ff
 );
 color:white;
 font-weight:800;
 cursor:pointer;
}

.secondary{
 border:1px solid #ffffff16;
 border-radius:11px;
 padding:12px 18px;
 background:#ffffff07;
 color:#fff;
 font-weight:700;
 cursor:pointer;
}

input[type=file]{
 display:none;
}

.workspace{
 display:none;
 margin-top:18px;
}

.info{
 padding:15px;
 border:1px solid #ffffff14;
 border-radius:15px;
 background:#ffffff05;
}

.filename{
 font-size:13px;
 font-weight:800;
}

.status{
 color:#858a9d;
 font-size:11px;
 margin-top:5px;
}

.toolbar{
 margin:15px 0;
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

textarea{
 width:100%;
 min-height:520px;
 resize:vertical;
 padding:20px;
 border-radius:18px;
 border:1px solid #ffffff15;
 background:#0c0e16;
 color:#e9ebf3;
 outline:none;
 font-size:14px;
 line-height:1.7;
}

textarea:focus{
 border-color:#35a9ff55;
}

.progress{
 display:none;
 height:5px;
 margin-top:15px;
 border-radius:99px;
 background:#ffffff0c;
 overflow:hidden;
}

.progress-bar{
 height:100%;
 width:0;
 background:#35a9ff;
 transition:.2s;
}

@media(max-width:600px){

 .hero{
  padding-top:35px;
 }

 h1{
  letter-spacing:-3px;
 }

 .toolbar{
  display:grid;
  grid-template-columns:1fr 1fr;
 }

}

</style>

</head>


<body>

<div class="container">


<header class="nav">

<a href="index.html" class="logo">
↻ ConvertX
</a>

<a href="index.html" class="back">
← All Tools
</a>

</header>


<section class="hero">

<span class="badge">
PDF TOOL
</span>

<h1>
PDF → <span class="gradient">Text</span>
</h1>

<p class="subtitle">
Extract selectable text from PDF documents directly
in your browser.
</p>

</section>


<div class="tool">


<div class="upload" id="upload">

<div class="upload-inner">

<div class="upload-icon">
📄
</div>

<h2>
Drop your PDF here
</h2>

<p>
PDF files only • Processing happens in your browser
</p>

<button
class="primary"
id="choose">
Choose PDF
</button>

</div>

</div>


<input
type="file"
id="file"
accept="application/pdf"
>


<div
class="progress"
id="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>


<div
class="workspace"
id="workspace">


<div class="info">

<div
class="filename"
id="filename">
</div>

<div
class="status"
id="status">
</div>

</div>


<div class="toolbar">

<button
class="secondary"
id="copy">
Copy Text
</button>

<button
class="secondary"
id="download">
Download TXT
</button>

<button
class="secondary"
id="clear">
Clear
</button>

</div>


<textarea
id="output"
placeholder="Extracted text will appear here..."
></textarea>


</div>

</div>

</div>


<script type="module">


import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


const upload =
document.getElementById("upload");

const choose =
document.getElementById("choose");

const fileInput =
document.getElementById("file");

const workspace =
document.getElementById("workspace");

const filename =
document.getElementById("filename");

const status =
document.getElementById("status");

const output =
document.getElementById("output");

const copy =
document.getElementById("copy");

const download =
document.getElementById("download");

const clear =
document.getElementById("clear");

const progress =
document.getElementById("progress");

const progressBar =
document.getElementById("progressBar");


let selectedFile=null;


/* FILE */

choose.onclick=function(e){

 e.stopPropagation();

 fileInput.click();

};


upload.onclick=function(){

 fileInput.click();

};


fileInput.onchange=function(){

 if(this.files[0]){

  processPDF(
   this.files[0]
  );

 }

};


/* PROCESS */

async function processPDF(file){

 if(
  file.type!=="application/pdf"
 ){

  alert(
   "Please select a PDF file."
  );

  return;

 }


 selectedFile=file;

 filename.textContent=
 file.name;

 workspace.style.display=
 "block";

 progress.style.display=
 "block";

 progressBar.style.width=
 "0%";

 output.value="";

 status.textContent=
 "Opening PDF...";


 try{

  const buffer=
  await file.arrayBuffer();


  const pdf=
  await pdfjsLib
  .getDocument({
   data:buffer
  })
  .promise;


  let completeText="";


  for(
   let pageNo=1;
   pageNo<=pdf.numPages;
   pageNo++
  ){

   status.textContent=
   "Extracting page "+
   pageNo+
   " of "+
   pdf.numPages;


   const page=
   await pdf.getPage(
    pageNo
   );


   const content=
   await page.getTextContent();


   let pageText="";


   for(
    const item of content.items
   ){

    if(
     typeof item.str==="string"
    ){

     pageText+=
      item.str+
      " ";

    }

   }


   completeText+=
   "\n\n"+
   "========== PAGE "+
   pageNo+
   " ==========\n\n"+
   pageText.trim();


   const percent=
   (pageNo/pdf.numPages)*100;


   progressBar.style.width=
   percent+"%";


   output.value=
   completeText.trim();

  }


  status.textContent=
   "✓ "+
   pdf.numPages+
   " page(s) processed.";


 }catch(error){

  console.error(error);

  status.textContent=
   "Unable to read this PDF.";

  output.value=
   "Error: This PDF could not be processed.";

 }

}


/* COPY */

copy.onclick=
async function(){

 if(!output.value)
 return;


 try{

  await navigator.clipboard
  .writeText(
   output.value
  );

  copy.textContent=
  "Copied ✓";


  setTimeout(
   ()=>{
    copy.textContent=
    "Copy Text";
   },
   1500
  );


 }catch(error){

  output.select();

  document.execCommand(
   "copy"
  );

 }

};


/* DOWNLOAD */

download.onclick=function(){

 if(!output.value)
 return;


 const blob=
 new Blob(
  [output.value],
  {
   type:"text/plain;charset=utf-8"
  }
 );


 const url=
 URL.createObjectURL(blob);


 const a=
 document.createElement("a");


 a.href=url;

 a.download=
 "extracted-text.txt";


 document.body.appendChild(a);

 a.click();

 a.remove();


 setTimeout(
  ()=>{
   URL.revokeObjectURL(url);
  },
  1000
 );

};


/* CLEAR */

clear.onclick=function(){

 selectedFile=null;

 fileInput.value="";

 workspace.style.display=
 "none";

 progress.style.display=
 "none";

 output.value="";

 filename.textContent="";

 status.textContent="";

};

</script>

</body>
</html>
