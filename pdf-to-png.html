<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<meta
name="description"
content="Convert PDF pages to PNG images online with ConvertX.">

<title>PDF to PNG - ConvertX</title>


<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#06070d;
 color:#fff;
 font-family:Inter,Arial,sans-serif;
}

.container{
 width:min(1100px,92%);
 margin:auto;
}

.nav{
 margin:20px 0;
 padding:15px 18px;
 border:1px solid #ffffff14;
 border-radius:20px;
 background:#ffffff06;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:#fff;
 text-decoration:none;
 font-size:21px;
 font-weight:900;
}

.back{
 color:#8d91a3;
 text-decoration:none;
 font-size:13px;
}

.hero{
 text-align:center;
 padding:55px 0 40px;
}

.badge{
 display:inline-block;
 padding:8px 13px;
 border-radius:999px;
 background:#ff704315;
 border:1px solid #ff704330;
 color:#ffb29a;
 font-size:11px;
 font-weight:800;
}

h1{
 margin:20px 0 12px;
 font-size:clamp(42px,7vw,70px);
 letter-spacing:-4px;
}

.gradient{
 color:#ff7043;
}

.subtitle{
 color:#8d91a3;
 line-height:1.7;
 max-width:700px;
 margin:auto;
}

.tool{
 padding:14px;
 border:1px solid #ffffff14;
 border-radius:26px;
 background:#ffffff05;
}

.upload{
 min-height:300px;
 border:2px dashed #ffffff22;
 border-radius:20px;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 cursor:pointer;
}

.upload:hover{
 border-color:#ff7043;
 background:#ff704307;
}

.upload-inner{
 padding:30px;
}

.upload-icon{
 font-size:50px;
}

.upload h2{
 margin:12px 0 7px;
}

.upload p{
 color:#777c90;
 font-size:13px;
}

.primary{
 border:0;
 border-radius:11px;
 padding:13px 20px;
 background:linear-gradient(
  135deg,
  #ff7043,
  #ff9a3d
 );
 color:white;
 font-weight:800;
 cursor:pointer;
}

.secondary{
 border:1px solid #ffffff16;
 border-radius:11px;
 padding:11px 17px;
 background:#ffffff07;
 color:#fff;
 cursor:pointer;
}

input[type=file]{
 display:none;
}

.controls{
 display:none;
 margin-top:18px;
 padding:17px;
 border:1px solid #ffffff14;
 border-radius:16px;
 background:#ffffff04;
}

.controls-row{
 display:grid;
 grid-template-columns:1fr 1fr auto;
 gap:10px;
 align-items:end;
}

label{
 display:block;
 color:#9da1b1;
 font-size:11px;
 margin-bottom:7px;
}

select{
 width:100%;
 padding:11px;
 border-radius:9px;
 background:#0c0e16;
 color:white;
 border:1px solid #ffffff18;
}

.status{
 text-align:center;
 color:#888d9f;
 font-size:12px;
 margin:17px 0;
}

.results{
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(250px,1fr));
 gap:15px;
}

.page-card{
 padding:12px;
 border:1px solid #ffffff14;
 border-radius:17px;
 background:#ffffff05;
}

.page-number{
 color:#999;
 font-size:11px;
 margin-bottom:9px;
}

.canvas-wrap{
 background:
 linear-gradient(45deg,#ddd 25%,transparent 25%),
 linear-gradient(-45deg,#ddd 25%,transparent 25%),
 linear-gradient(45deg,transparent 75%,#ddd 75%),
 linear-gradient(-45deg,transparent 75%,#ddd 75%);
 background-size:20px 20px;
 background-position:0 0,0 10px,10px -10px,-10px 0;
 border-radius:10px;
 padding:5px;
 overflow:hidden;
}

canvas{
 display:block;
 width:100%;
 height:auto;
}

.download-page{
 width:100%;
 margin-top:10px;
}

@media(max-width:700px){

 .controls-row{
  grid-template-columns:1fr;
 }

 h1{
  letter-spacing:-3px;
 }

}

</style>

</head>


<body>


<div class="container">


<header class="nav">

<a href="index.html" class="logo">
↻ ConvertX
</a>

<a href="index.html" class="back">
← All Tools
</a>

</header>


<section class="hero">

<span class="badge">
PDF CONVERTER
</span>

<h1>
PDF → <span class="gradient">PNG</span>
</h1>

<p class="subtitle">
Convert every PDF page into a high-quality PNG image.
Everything is processed locally in your browser.
</p>

</section>


<div class="tool">


<div
class="upload"
id="upload">

<div class="upload-inner">

<div class="upload-icon">
📄
</div>

<h2>
Drop your PDF here
</h2>

<p>
Convert pages individually into PNG files
</p>

<button
class="primary"
id="choose">
Choose PDF
</button>

</div>

</div>


<input
type="file"
id="file"
accept="application/pdf"
>


<div
class="controls"
id="controls">


<div class="controls-row">


<div>

<label>
RENDER QUALITY
</label>

<select id="scale">

<option value="1">
Normal
</option>

<option
value="1.5"
selected>
High
</option>

<option value="2">
Very High
</option>

<option value="3">
Ultra
</option>

</select>

</div>


<div>

<label>
BACKGROUND
</label>

<select id="background">

<option value="white">
White
</option>

<option value="transparent">
Transparent
</option>

</select>

</div>


<button
class="primary"
id="convert">
Convert PDF
</button>


</div>

</div>


<div
class="status"
id="status">
</div>


<div
class="results"
id="results">
</div>


</div>

</div>


<script type="module">


import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


const upload=
document.getElementById("upload");

const choose=
document.getElementById("choose");

const fileInput=
document.getElementById("file");

const controls=
document.getElementById("controls");

const convert=
document.getElementById("convert");

const scaleSelect=
document.getElementById("scale");

const background=
document.getElementById("background");

const status=
document.getElementById("status");

const results=
document.getElementById("results");


let selectedFile=null;


choose.onclick=
function(e){

 e.stopPropagation();

 fileInput.click();

};


upload.onclick=
function(){

 fileInput.click();

};


fileInput.onchange=
function(){

 if(this.files[0]){

  selectedFile=
  this.files[0];

  controls.style.display=
  "block";

  results.innerHTML="";

  status.textContent=
  selectedFile.name+
  " selected.";

 }

};


convert.onclick=
async function(){

 if(!selectedFile)
 return;


 convert.disabled=true;

 convert.textContent=
 "Converting...";


 results.innerHTML="";


 try{

  const buffer=
  await selectedFile.arrayBuffer();


  const pdf=
  await pdfjsLib
  .getDocument({
   data:buffer
  })
  .promise;


  for(
   let pageNumber=1;
   pageNumber<=pdf.numPages;
   pageNumber++
  ){

   status.textContent=
   "Rendering page "+
   pageNumber+
   " of "+
   pdf.numPages;


   const page=
   await pdf.getPage(
    pageNumber
   );


   const viewport=
   page.getViewport({
    scale:Number(
     scaleSelect.value
    )
   });


   const canvas=
   document.createElement(
    "canvas"
   );


   canvas.width=
   Math.ceil(
    viewport.width
   );

   canvas.height=
   Math.ceil(
    viewport.height
   );


   const ctx=
   canvas.getContext("2d");


   if(
    background.value==="white"
   ){

    ctx.save();

    ctx.fillStyle="#fff";

    ctx.fillRect(
     0,
     0,
     canvas.width,
     canvas.height
    );

    ctx.restore();

   }


   await page.render({

    canvasContext:ctx,

    viewport:viewport,

    background:
    background.value==="white"
    ?"#ffffff"
    :undefined

   }).promise;


   createCard(
    canvas,
    pageNumber
   );

  }


  status.textContent=
  "✓ "+
  pdf.numPages+
  " page(s) converted successfully.";


 }catch(error){

  console.error(error);

  status.textContent=
  "Could not convert this PDF.";

 }


 convert.disabled=false;

 convert.textContent=
 "Convert PDF";

};


function createCard(
 canvas,
 pageNumber
){

 const card=
 document.createElement(
  "div"
 );

 card.className=
 "page-card";


 const title=
 document.createElement(
  "div"
 );

 title.className=
 "page-number";

 title.textContent=
 "PAGE "+
 pageNumber;


 const wrap=
 document.createElement(
  "div"
 );

 wrap.className=
 "canvas-wrap";


 wrap.appendChild(
  canvas
 );


 const button=
 document.createElement(
  "button"
 );

 button.className=
 "primary download-page";

 button.textContent=
 "⬇ Download PNG";


 button.onclick=
 function(){

  canvas.toBlob(
   function(blob){

    const url=
    URL.createObjectURL(
     blob
    );


    const a=
    document.createElement(
     "a"
    );


    a.href=url;

    a.download=
    "page-"+
    pageNumber+
    ".png";


    document.body.appendChild(
     a
    );

    a.click();

    a.remove();


    setTimeout(
     ()=>{
      URL.revokeObjectURL(
       url
      );
     },
     1000
    );

   },
   "image/png"
  );

 };


 card.appendChild(title);

 card.appendChild(wrap);

 card.appendChild(button);

 results.appendChild(card);

}

</script>

</body>
</html>
