<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPG to PDF — ConvertX</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080b14;
    color:#fff;
}
.container{
    width:min(900px,92%);
    margin:40px auto;
}
.header{
    text-align:center;
    margin-bottom:30px;
}
.logo{
    font-size:32px;
    font-weight:800;
}
.logo span{color:#8b6cff}
.subtitle{
    color:#9da5b8;
    margin-top:8px;
}
.card{
    background:#111624;
    border:1px solid #252d42;
    border-radius:22px;
    padding:28px;
    box-shadow:0 20px 60px #0005;
}
.drop{
    border:2px dashed #3a4560;
    border-radius:18px;
    padding:45px 20px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}
.drop:hover,.drop.drag{
    border-color:#8b6cff;
    background:#8b6cff12;
}
.drop-icon{
    font-size:50px;
    margin-bottom:12px;
}
input[type=file]{display:none}
button{
    border:0;
    border-radius:12px;
    padding:13px 20px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}
.primary{
    background:#8b6cff;
    color:#fff;
}
.secondary{
    background:#222a3d;
    color:#fff;
}
.controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
}
.control{
    flex:1;
    min-width:180px;
}
label{
    display:block;
    color:#aeb7ca;
    margin-bottom:7px;
    font-size:13px;
}
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #303a52;
    background:#0d1220;
    color:#fff;
}
.preview{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
    margin-top:25px;
}
.item{
    position:relative;
    background:#0c111d;
    border:1px solid #293248;
    border-radius:14px;
    padding:8px;
}
.item img{
    width:100%;
    height:140px;
    object-fit:contain;
    border-radius:9px;
    background:#080b14;
}
.item-name{
    font-size:12px;
    color:#b9c1d1;
    margin-top:7px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.remove{
    position:absolute;
    right:8px;
    top:8px;
    width:30px;
    height:30px;
    padding:0;
    border-radius:50%;
    background:#ff5364;
    color:#fff;
}
.actions{
    display:flex;
    gap:12px;
    margin-top:25px;
}
.actions button{flex:1}
.status{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    background:#0b101c;
    color:#9faac0;
    text-align:center;
    min-height:20px;
}
.back{
    display:inline-block;
    color:#aeb7ca;
    text-decoration:none;
    margin-bottom:20px;
}
@media(max-width:600px){
    .container{margin:20px auto}
    .card{padding:18px}
    .actions{flex-direction:column}
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="index.html">← Back to ConvertX</a>

<div class="header">
    <div class="logo">Convert<span>X</span></div>
    <div class="subtitle">JPG / PNG Images → PDF</div>
</div>

<div class="card">

    <div class="drop" id="dropZone">
        <div class="drop-icon">🖼️</div>
        <h2>Select Images</h2>
        <p>Choose JPG, JPEG or PNG images</p>

        <button
            class="primary"
            type="button"
            id="chooseBtn">
            Choose Images
        </button>

        <input
            id="fileInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            multiple>
    </div>

    <div class="preview" id="preview"></div>

    <div class="controls">

        <div class="control">
            <label>Page Size</label>
            <select id="pageSize">
                <option value="a4">A4</option>
                <option value="letter">Letter</option>
                <option value="fit">Fit Image</option>
            </select>
        </div>

        <div class="control">
            <label>Orientation</label>
            <select id="orientation">
                <option value="auto">Auto</option>
                <option value="portrait">Portrait</option>
                <option value="landscape">Landscape</option>
            </select>
        </div>

        <div class="control">
            <label>Image Quality</label>
            <select id="quality">
                <option value="1">High</option>
                <option value=".8" selected>Good</option>
                <option value=".6">Medium</option>
                <option value=".4">Small File</option>
            </select>
        </div>

    </div>

    <div class="actions">

        <button
            class="secondary"
            id="clearBtn"
            type="button">
            Clear
        </button>

        <button
            class="primary"
            id="convertBtn"
            type="button">
            Convert to PDF
        </button>

    </div>

    <div class="status" id="status">
        Select one or more images to begin.
    </div>

</div>
</div>

<script>
const { jsPDF } = window.jspdf;

const fileInput =
    document.getElementById("fileInput");

const chooseBtn =
    document.getElementById("chooseBtn");

const dropZone =
    document.getElementById("dropZone");

const preview =
    document.getElementById("preview");

const convertBtn =
    document.getElementById("convertBtn");

const clearBtn =
    document.getElementById("clearBtn");

const statusBox =
    document.getElementById("status");

let files = [];

chooseBtn.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", e => {
    addFiles([...e.target.files]);
    fileInput.value = "";
});

["dragenter","dragover"].forEach(type => {
    dropZone.addEventListener(type, e => {
        e.preventDefault();
        dropZone.classList.add("drag");
    });
});

["dragleave","drop"].forEach(type => {
    dropZone.addEventListener(type, e => {
        e.preventDefault();
        dropZone.classList.remove("drag");
    });
});

dropZone.addEventListener("drop", e => {
    addFiles([...e.dataTransfer.files]);
});

function addFiles(newFiles){

    const valid =
        newFiles.filter(file =>
            file.type === "image/jpeg" ||
            file.type === "image/png" ||
            file.type === "image/webp"
        );

    files.push(...valid);

    renderPreview();

    statusBox.textContent =
        files.length
        ? `${files.length} image${files.length > 1 ? "s" : ""} selected.`
        : "No valid images selected.";
}

function renderPreview(){

    preview.innerHTML = "";

    files.forEach((file,index) => {

        const item =
            document.createElement("div");

        item.className = "item";

        const img =
            document.createElement("img");

        img.src =
            URL.createObjectURL(file);

        const name =
            document.createElement("div");

        name.className = "item-name";

        name.textContent =
            file.name;

        const remove =
            document.createElement("button");

        remove.className = "remove";

        remove.type = "button";

        remove.textContent = "×";

        remove.onclick = () => {

            files.splice(index,1);

            renderPreview();

            statusBox.textContent =
                files.length
                ? `${files.length} image${files.length > 1 ? "s" : ""} selected.`
                : "Select images to begin.";
        };

        item.appendChild(img);
        item.appendChild(remove);
        item.appendChild(name);

        preview.appendChild(item);
    });
}

clearBtn.addEventListener("click", () => {

    files = [];

    renderPreview();

    statusBox.textContent =
        "Select one or more images to begin.";
});

function loadImage(file){

    return new Promise((resolve,reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = reject;

        img.src =
            URL.createObjectURL(file);
    });
}

function calculateSize(
    img,
    pageWidth,
    pageHeight,
    margin
){

    const maxWidth =
        pageWidth - margin * 2;

    const maxHeight =
        pageHeight - margin * 2;

    const ratio =
        Math.min(
            maxWidth / img.width,
            maxHeight / img.height
        );

    return {
        width: img.width * ratio,
        height: img.height * ratio
    };
}

convertBtn.addEventListener("click", async () => {

    if(!files.length){

        statusBox.textContent =
            "Please select at least one image.";

        return;
    }

    convertBtn.disabled = true;

    convertBtn.textContent =
        "Creating PDF...";

    try{

        const pageSize =
            document.getElementById(
                "pageSize"
            ).value;

        const selectedOrientation =
            document.getElementById(
                "orientation"
            ).value;

        const quality =
            Number(
                document.getElementById(
                    "quality"
                ).value
            );

        let pdf = null;

        for(let i=0;i<files.length;i++){

            statusBox.textContent =
                `Processing image ${i+1} of ${files.length}...`;

            const file =
                files[i];

            const img =
                await loadImage(file);

            let orientation =
                selectedOrientation;

            if(orientation === "auto"){

                orientation =
                    img.width >= img.height
                    ? "landscape"
                    : "portrait";
            }

            let format =
                pageSize === "fit"
                ? "a4"
                : pageSize;

            if(!pdf){

                pdf =
                    new jsPDF({
                        orientation,
                        unit:"mm",
                        format
                    });

            }
            else{

                pdf.addPage(
                    format,
                    orientation
                );

            }

            const pageWidth =
                pdf.internal.pageSize.getWidth();

            const pageHeight =
                pdf.internal.pageSize.getHeight();

            const margin =
                pageSize === "fit"
                ? 0
                : 10;

            let drawWidth;
            let drawHeight;
            let x;
            let y;

            if(pageSize === "fit"){

                const pxToMm =
                    0.264583;

                drawWidth =
                    img.width * pxToMm;

                drawHeight =
                    img.height * pxToMm;

                x =
                    Math.max(
                        0,
                        (pageWidth - drawWidth) / 2
                    );

                y =
                    Math.max(
                        0,
                        (pageHeight - drawHeight) / 2
                    );

            }
            else{

                const size =
                    calculateSize(
                        img,
                        pageWidth,
                        pageHeight,
                        margin
                    );

                drawWidth =
                    size.width;

                drawHeight =
                    size.height;

                x =
                    (pageWidth - drawWidth) / 2;

                y =
                    (pageHeight - drawHeight) / 2;
            }

            const canvas =
                document.createElement("canvas");

            canvas.width =
                img.naturalWidth;

            canvas.height =
                img.naturalHeight;

            const ctx =
                canvas.getContext("2d");

            ctx.fillStyle = "#ffffff";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.drawImage(
                img,
                0,
                0
            );

            const data =
                canvas.toDataURL(
                    "image/jpeg",
                    quality
                );

            pdf.addImage(
                data,
                "JPEG",
                x,
                y,
                drawWidth,
                drawHeight,
                undefined,
                "FAST"
            );

            URL.revokeObjectURL(
                img.src
            );
        }

        statusBox.textContent =
            "PDF created successfully. Download started.";

        pdf.save(
            "convertx-images.pdf"
        );

    }
    catch(error){

        console.error(error);

        statusBox.textContent =
            "Could not create PDF. Please try another image.";

    }
    finally{

        convertBtn.disabled = false;

        convertBtn.textContent =
            "Convert to PDF";
    }

});
</script>

</body>
</html>
