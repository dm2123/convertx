<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delete PDF Pages — ConvertX</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#070711;
 color:#fff;
}

.container{
 width:min(900px,92%);
 margin:auto;
}

.nav{
 margin:20px 0;
 padding:14px 18px;
 border:1px solid #ffffff1c;
 border-radius:18px;
 background:#ffffff08;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:#fff;
 text-decoration:none;
 font-size:20px;
 font-weight:800;
}

.back{
 color:#9999aa;
 text-decoration:none;
 font-size:13px;
}

.hero{
 text-align:center;
 padding:55px 0 30px;
}

.badge{
 display:inline-block;
 padding:7px 12px;
 border-radius:50px;
 background:#ff657710;
 border:1px solid #ff657733;
 color:#ffabb5;
 font-size:11px;
 font-weight:bold;
}

h1{
 font-size:clamp(40px,7vw,64px);
 letter-spacing:-3px;
 margin:20px 0 12px;
}

.gradient{
 background:linear-gradient(90deg,#ff7080,#ff9d66);
 -webkit-background-clip:text;
 color:transparent;
}

.subtitle{
 color:#9999aa;
 line-height:1.7;
 max-width:620px;
 margin:auto;
}

.tool{
 padding:12px;
 border:1px solid #ffffff1c;
 border-radius:25px;
 background:#ffffff08;
}

.upload{
 min-height:260px;
 border:2px dashed #ffffff25;
 border-radius:18px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 cursor:pointer;
 padding:30px;
}

.upload:hover{
 border-color:#ff6577;
 background:#ff657708;
}

.upload-icon{
 font-size:45px;
 margin-bottom:15px;
}

.upload h2{
 margin:5px 0;
}

.upload p{
 color:#9999aa;
 font-size:13px;
}

.choose,
.delete-btn{
 border:0;
 border-radius:11px;
 padding:13px 20px;
 background:linear-gradient(135deg,#ff6577,#ff9b66);
 color:#fff;
 font-weight:bold;
 cursor:pointer;
}

input[type=file]{
 display:none;
}

.workspace{
 display:none;
 padding:22px;
}

.file{
 display:flex;
 align-items:center;
 gap:14px;
 padding:16px;
 border:1px solid #ffffff1a;
 border-radius:14px;
 background:#ffffff06;
}

.file-icon{
 width:45px;
 height:45px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:#ff657710;
 font-size:22px;
}

.file-info{
 flex:1;
 min-width:0;
}

.file-name{
 font-size:14px;
 font-weight:bold;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

.file-size{
 color:#9999aa;
 font-size:11px;
 margin-top:5px;
}

.toolbar{
 margin-top:20px;
 padding:15px;
 border:1px solid #ffffff1a;
 border-radius:15px;
 display:flex;
 gap:10px;
 flex-wrap:wrap;
}

.tool-btn{
 padding:10px 14px;
 border-radius:9px;
 border:1px solid #ffffff1c;
 background:#ffffff08;
 color:#fff;
 cursor:pointer;
 font-size:12px;
}

.pages{
 margin-top:20px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}

.page{
 position:relative;
 padding:12px;
 border:1px solid #ffffff1c;
 border-radius:14px;
 background:#ffffff06;
 cursor:pointer;
 text-align:center;
 transition:.2s;
}

.page:hover{
 border-color:#ff6577;
 transform:translateY(-2px);
}

.page.selected{
 border-color:#ff6577;
 background:#ff657710;
}

.page-number{
 font-size:12px;
 font-weight:bold;
 margin-bottom:10px;
}

.page canvas{
 max-width:100%;
 height:auto;
 background:#fff;
 border-radius:6px;
}

.check{
 position:absolute;
 top:8px;
 right:8px;
 width:18px;
 height:18px;
 accent-color:#ff6577;
}

.bottom{
 margin-top:20px;
 display:flex;
 gap:10px;
}

.reset{
 flex:1;
 border:1px solid #ffffff1c;
 border-radius:11px;
 background:#ffffff08;
 color:#fff;
 cursor:pointer;
}

.delete-btn{
 flex:2;
}

.status{
 display:none;
 margin-top:20px;
 padding:18px;
 border-radius:15px;
 text-align:center;
 background:#55e6a508;
 border:1px solid #55e6a533;
}

.status-title{
 color:#9df3c8;
 font-weight:bold;
}

.download{
 display:inline-block;
 margin-top:12px;
 padding:11px 18px;
 border-radius:10px;
 background:#55e6a5;
 color:#06130d;
 text-decoration:none;
 font-weight:bold;
 font-size:13px;
}

.info{
 margin-top:12px;
 color:#777788;
 font-size:11px;
 text-align:center;
}

@media(max-width:700px){
 .pages{
  grid-template-columns:repeat(3,1fr);
 }
}

@media(max-width:500px){
 .pages{
  grid-template-columns:repeat(2,1fr);
 }

 .bottom{
  flex-direction:column;
 }
}
</style>
</head>

<body>

<div class="container">

<header class="nav">

<a href="index.html" class="logo">
↻ ConvertX
</a>

<a href="index.html" class="back">
← Home
</a>

</header>


<section class="hero">

<span class="badge">
PDF EDITOR
</span>

<h1>
Delete <span class="gradient">Pages</span>
</h1>

<p class="subtitle">
Remove unwanted pages from your PDF and create
a clean new document.
</p>

</section>


<div class="tool">

<div class="upload" id="upload">

<div class="upload-icon">
🗑️
</div>

<h2>
Choose your PDF
</h2>

<p>
Select the pages you want to remove
</p>

<button class="choose" id="choose">
Choose PDF
</button>

<input
id="fileInput"
type="file"
accept="application/pdf">

</div>


<div class="workspace" id="workspace">


<div class="file">

<div class="file-icon">
📄
</div>

<div class="file-info">

<div class="file-name" id="fileName"></div>

<div class="file-size" id="fileSize"></div>

</div>

</div>


<div class="toolbar">

<button
class="tool-btn"
id="selectAll">
Select All
</button>

<button
class="tool-btn"
id="clearAll">
Clear Selection
</button>

</div>


<div class="pages" id="pages"></div>


<div class="info">
Tap pages to select them for deletion.
</div>


<div class="bottom">

<button
class="reset"
id="reset">
Clear
</button>

<button
class="delete-btn"
id="delete">
Delete Selected Pages
</button>

</div>


<div class="status" id="status">

<div class="status-title">
✓ New PDF created
</div>

<p
id="statusText"
style="color:#9999aa;font-size:12px">
</p>

<a
class="download"
id="download">
⬇ Download PDF
</a>

</div>


</div>

</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const upload =
document.getElementById("upload");

const choose =
document.getElementById("choose");

const fileInput =
document.getElementById("fileInput");

const workspace =
document.getElementById("workspace");

const fileName =
document.getElementById("fileName");

const fileSize =
document.getElementById("fileSize");

const pages =
document.getElementById("pages");

const selectAll =
document.getElementById("selectAll");

const clearAll =
document.getElementById("clearAll");

const deleteBtn =
document.getElementById("delete");

const reset =
document.getElementById("reset");

const status =
document.getElementById("status");

const statusText =
document.getElementById("statusText");

const download =
document.getElementById("download");


let selectedFile = null;

let totalPages = 0;

let selectedPages = new Set();


/* OPEN */

choose.onclick = function(e){

 e.stopPropagation();

 fileInput.click();

};

upload.onclick = function(){

 fileInput.click();

};


/* FILE */

fileInput.onchange = function(){

 if(this.files[0]){

  loadPDF(this.files[0]);

 }

};


/* LOAD PDF */

async function loadPDF(file){

 if(file.type !== "application/pdf"){

  alert("Please select a PDF file.");

  return;

 }

 selectedFile = file;

 fileName.textContent =
 file.name;

 fileSize.textContent =
 formatBytes(file.size);

 upload.style.display =
 "none";

 workspace.style.display =
 "block";

 status.style.display =
 "none";

 selectedPages.clear();

 pages.innerHTML = "";


 try{

  const bytes =
   await file.arrayBuffer();

  const pdf =
   await pdfjsLib.getDocument({
    data:bytes
   }).promise;

  totalPages =
   pdf.numPages;


  for(let i=1;i<=totalPages;i++){

   await createPage(
    pdf,
    i
   );

  }

 }catch(error){

  console.error(error);

  alert(
   "Could not read this PDF."
  );

 }

}


/* CREATE PAGE */

async function createPage(pdf, number){

 const page =
  await pdf.getPage(number);

 const viewport =
  page.getViewport({
   scale:.55
  });


 const card =
  document.createElement("div");

 card.className =
  "page";

 card.dataset.page =
  number;


 const title =
  document.createElement("div");

 title.className =
  "page-number";

 title.textContent =
  "Page " + number;


 const canvas =
  document.createElement("canvas");

 canvas.width =
  viewport.width;

 canvas.height =
  viewport.height;


 const check =
  document.createElement("input");

 check.type =
  "checkbox";

 check.className =
  "check";


 check.onclick =
 function(e){

  e.stopPropagation();

 };


 card.appendChild(
  title
 );

 card.appendChild(
  canvas
 );

 card.appendChild(
  check
 );


 card.onclick =
 function(){

  togglePage(
   number,
   card,
   check
  );

 };


 pages.appendChild(card);


 await page.render({

  canvasContext:
   canvas.getContext("2d"),

  viewport:
   viewport

 }).promise;

}


/* SELECT */

function togglePage(
 number,
 card,
 checkbox
){

 if(
  selectedPages.has(number)
 ){

  selectedPages.delete(number);

  card.classList.remove(
   "selected"
  );

  checkbox.checked =
   false;

 }else{

  selectedPages.add(number);

  card.classList.add(
   "selected"
  );

  checkbox.checked =
   true;

 }

}


/* SELECT ALL */

selectAll.onclick =
function(){

 selectedPages.clear();

 document
 .querySelectorAll(".page")
 .forEach(card => {

  const number =
   Number(card.dataset.page);

  selectedPages.add(
   number
  );

  card.classList.add(
   "selected"
  );

  card.querySelector(
   ".check"
  ).checked = true;

 });

};


/* CLEAR */

clearAll.onclick =
function(){

 selectedPages.clear();

 document
 .querySelectorAll(".page")
 .forEach(card => {

  card.classList.remove(
   "selected"
  );

  card.querySelector(
   ".check"
  ).checked = false;

 });

};


/* DELETE */

deleteBtn.onclick =
async function(){

 if(!selectedFile){

  alert(
   "Please select a PDF."
  );

  return;

 }


 if(selectedPages.size === 0){

  alert(
   "Select at least one page to delete."
  );

  return;

 }


 if(
  selectedPages.size >=
  totalPages
 ){

  alert(
   "You cannot delete every page. " +
   "Keep at least one page."
  );

  return;

 }


 deleteBtn.disabled =
  true;

 deleteBtn.textContent =
  "Creating PDF...";


 try{

  const bytes =
   await selectedFile.arrayBuffer();


  const source =
   await PDFLib.PDFDocument.load(
    bytes
   );


  const output =
   await PDFLib.PDFDocument.create();


  const keepIndices = [];


  for(
   let i=1;
   i<=totalPages;
   i++
  ){

   if(
    !selectedPages.has(i)
   ){

    keepIndices.push(
     i-1
    );

   }

  }


  const copied =
   await output.copyPages(
    source,
    keepIndices
   );


  copied.forEach(
   page =>
    output.addPage(page)
  );


  const result =
   await output.save({
    useObjectStreams:true
   });


  const blob =
   new Blob(
    [result],
    {
     type:
      "application/pdf"
    }
   );


  const url =
   URL.createObjectURL(
    blob
   );


  download.href =
   url;

  download.download =
   "edited-" +
   selectedFile.name;


  statusText.textContent =
   "Removed " +
   selectedPages.size +
   " page(s). " +
   "Remaining: " +
   keepIndices.length +
   " page(s).";


  status.style.display =
   "block";


 }catch(error){

  console.error(error);

  alert(
   "Unable to create the PDF."
  );

 }


 deleteBtn.disabled =
  false;

 deleteBtn.textContent =
  "Delete Selected Pages";

};


/* RESET */

reset.onclick =
function(){

 selectedFile = null;

 totalPages = 0;

 selectedPages.clear();

 fileInput.value = "";

 pages.innerHTML = "";

 workspace.style.display =
  "none";

 upload.style.display =
  "flex";

 status.style.display =
  "none";

};


/* SIZE */

function formatBytes(bytes){

 if(bytes === 0)
  return "0 Bytes";

 const units = [
  "Bytes",
  "KB",
  "MB",
  "GB"
 ];

 const i =
  Math.floor(
   Math.log(bytes) /
   Math.log(1024)
  );

 return (
  bytes /
  Math.pow(1024,i)
 ).toFixed(2)
 +
 " "
 +
 units[i];

}

</script>

</body>
</html>
