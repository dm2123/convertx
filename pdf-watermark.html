<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta
name="description"
content="Add text watermark to PDF files online with ConvertX.">

<title>PDF Watermark - ConvertX</title>

<style>

*{box-sizing:border-box}

body{
 margin:0;
 background:#06070d;
 color:#fff;
 font-family:Inter,Arial,sans-serif;
}

.container{
 width:min(1100px,92%);
 margin:auto;
}

.nav{
 margin:20px 0;
 padding:15px 18px;
 border:1px solid #ffffff14;
 border-radius:20px;
 background:#ffffff06;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:#fff;
 text-decoration:none;
 font-size:21px;
 font-weight:900;
}

.back{
 color:#8d91a3;
 text-decoration:none;
 font-size:13px;
}

.hero{
 text-align:center;
 padding:55px 0 38px;
}

.badge{
 display:inline-block;
 padding:8px 13px;
 border-radius:999px;
 background:#35d6a012;
 border:1px solid #35d6a033;
 color:#8ff4d0;
 font-size:11px;
 font-weight:800;
}

h1{
 margin:20px 0 12px;
 font-size:clamp(42px,7vw,70px);
 letter-spacing:-4px;
}

.gradient{
 color:#35d6a0;
}

.subtitle{
 max-width:700px;
 margin:auto;
 color:#8d91a3;
 line-height:1.7;
}

.tool{
 padding:14px;
 border:1px solid #ffffff14;
 border-radius:27px;
 background:#ffffff05;
}

.upload{
 min-height:290px;
 border:2px dashed #ffffff22;
 border-radius:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 cursor:pointer;
}

.upload:hover{
 border-color:#35d6a0;
}

.upload-icon{
 font-size:50px;
}

.upload h2{
 margin:8px 0;
}

.upload p{
 color:#777c90;
 font-size:13px;
}

.primary{
 border:0;
 border-radius:11px;
 padding:13px 20px;
 background:linear-gradient(
  135deg,
  #35d6a0,
  #35a9ff
 );
 color:white;
 font-weight:800;
 cursor:pointer;
}

.secondary{
 border:1px solid #ffffff16;
 border-radius:11px;
 padding:12px 18px;
 background:#ffffff07;
 color:#fff;
 font-weight:700;
 cursor:pointer;
}

input[type=file]{
 display:none;
}

.workspace{
 display:none;
 margin-top:18px;
}

.layout{
 display:grid;
 grid-template-columns:310px 1fr;
 gap:16px;
}

.controls{
 padding:20px;
 border:1px solid #ffffff14;
 border-radius:20px;
 background:#ffffff05;
}

.title{
 font-size:11px;
 font-weight:900;
 color:#9ca0b1;
 margin-bottom:15px;
}

.field{
 margin-bottom:16px;
}

label{
 display:block;
 color:#999ead;
 font-size:11px;
 margin-bottom:7px;
}

input[type=text],
input[type=number],
select{
 width:100%;
 padding:11px;
 background:#0b0d15;
 color:white;
 border:1px solid #ffffff18;
 border-radius:10px;
 outline:none;
}

input[type=color]{
 width:100%;
 height:42px;
 background:#0b0d15;
 border:1px solid #ffffff18;
 border-radius:10px;
}

input[type=range]{
 width:100%;
 accent-color:#35d6a0;
}

.value{
 float:right;
 color:#35d6a0;
}

.preview{
 min-height:530px;
 border:1px solid #ffffff14;
 border-radius:20px;
 background:#0c0e16;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:25px;
 overflow:hidden;
}

.paper{
 width:min(470px,90%);
 aspect-ratio:8.27/11.69;
 background:#fff;
 position:relative;
 box-shadow:0 20px 60px #0009;
 padding:50px;
 color:#333;
 overflow:hidden;
}

.lines{
 margin-top:30px;
}

.line{
 height:7px;
 background:#ddd;
 border-radius:5px;
 margin-bottom:15px;
}

.line:nth-child(2){width:88%}
.line:nth-child(3){width:70%}
.line:nth-child(4){width:95%}
.line:nth-child(5){width:80%}
.line:nth-child(6){width:90%}

.watermark{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%) rotate(-35deg);
 font-size:40px;
 font-weight:900;
 white-space:nowrap;
 pointer-events:none;
 opacity:.3;
}

.actions{
 margin-top:17px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.download{
 display:none;
 grid-column:1/-1;
 text-align:center;
 text-decoration:none;
}

.status{
 text-align:center;
 color:#8d91a3;
 font-size:12px;
 margin-top:12px;
}

@media(max-width:800px){
 .layout{grid-template-columns:1fr}
 h1{letter-spacing:-3px}
}

</style>
</head>

<body>

<div class="container">

<header class="nav">
<a href="index.html" class="logo">↻ ConvertX</a>
<a href="index.html" class="back">← All Tools</a>
</header>

<section class="hero">

<span class="badge">PDF EDITOR</span>

<h1>
PDF <span class="gradient">Watermark</span>
</h1>

<p class="subtitle">
Protect and brand your PDF documents by adding
a customizable text watermark.
</p>

</section>

<div class="tool">

<div class="upload" id="upload">

<div>

<div class="upload-icon">💧</div>

<h2>Drop your PDF here</h2>

<p>Add your watermark directly to the document</p>

<button class="primary" id="choose">
Choose PDF
</button>

</div>

</div>

<input
type="file"
id="file"
accept="application/pdf"
>

<div class="workspace" id="workspace">

<div class="layout">

<div class="controls">

<div class="title">
WATERMARK SETTINGS
</div>

<div class="field">

<label>
WATERMARK TEXT
</label>

<input
type="text"
id="text"
value="CONFIDENTIAL"
>

</div>

<div class="field">

<label>
OPACITY
<span
class="value"
id="opacityValue">
30%
</span>
</label>

<input
type="range"
id="opacity"
min="5"
max="100"
value="30"
>

</div>

<div class="field">

<label>
FONT SIZE
</label>

<input
type="number"
id="fontSize"
min="8"
max="100"
value="40"
>

</div>

<div class="field">

<label>
ROTATION
</label>

<input
type="number"
id="rotation"
min="-180"
max="180"
value="-35"
>

</div>

<div class="field">

<label>
COLOR
</label>

<input
type="color"
id="color"
value="#555555"
>

</div>

<div class="field">

<label>
POSITION
</label>

<select id="position">

<option value="center">Center</option>
<option value="top">Top</option>
<option value="bottom">Bottom</option>

</select>

</div>

<button
class="primary"
id="process"
style="width:100%">
Apply Watermark
</button>

<div class="status" id="status"></div>

<div class="actions">

<button
class="secondary"
id="reset">
Reset
</button>

<a
class="primary download"
id="download">
Download PDF
</a>

</div>

</div>

<div class="preview">

<div class="paper">

<div class="lines">

<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>

</div>

<div
class="watermark"
id="watermark">
CONFIDENTIAL
</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>

const upload=
document.getElementById("upload");

const choose=
document.getElementById("choose");

const fileInput=
document.getElementById("file");

const workspace=
document.getElementById("workspace");

const text=
document.getElementById("text");

const opacity=
document.getElementById("opacity");

const opacityValue=
document.getElementById("opacityValue");

const fontSize=
document.getElementById("fontSize");

const rotation=
document.getElementById("rotation");

const color=
document.getElementById("color");

const position=
document.getElementById("position");

const watermark=
document.getElementById("watermark");

const process=
document.getElementById("process");

const reset=
document.getElementById("reset");

const download=
document.getElementById("download");

const status=
document.getElementById("status");

let selectedFile=null;


choose.onclick=function(e){
 e.stopPropagation();
 fileInput.click();
};

upload.onclick=function(){
 fileInput.click();
};

fileInput.onchange=function(){

 if(this.files[0]){

  selectedFile=this.files[0];

  workspace.style.display="block";

  updatePreview();

 }

};


[
 text,
 opacity,
 fontSize,
 rotation,
 color,
 position
].forEach(function(el){

 el.addEventListener(
  "input",
  updatePreview
 );

 el.addEventListener(
  "change",
  updatePreview
 );

});


function hexToRgb(hex){

 return {

  r:parseInt(
   hex.substring(1,3),
   16
  )/255,

  g:parseInt(
   hex.substring(3,5),
   16
  )/255,

  b:parseInt(
   hex.substring(5,7),
   16
  )/255

 };

}


function updatePreview(){

 watermark.textContent=
 text.value ||
 "WATERMARK";

 watermark.style.opacity=
 Number(opacity.value)/100;

 watermark.style.fontSize=
 fontSize.value+"px";

 watermark.style.color=
 color.value;

 watermark.style.transform=
 "translate(-50%,-50%) rotate("+
 rotation.value+
 "deg)";

 opacityValue.textContent=
 opacity.value+"%";


 if(position.value==="top"){

  watermark.style.top="18%";

 }

 else if(position.value==="bottom"){

  watermark.style.top="82%";

 }

 else{

  watermark.style.top="50%";

 }

}


process.onclick=async function(){

 if(!selectedFile){

  alert("Please select a PDF.");

  return;

 }

 process.disabled=true;

 process.textContent=
 "Processing...";

 status.textContent=
 "Applying watermark...";


 try{

  const bytes=
  await selectedFile.arrayBuffer();

  const pdfDoc=
  await PDFLib.PDFDocument.load(
   bytes
  );

  const pages=
  pdfDoc.getPages();

  const rgb=
  hexToRgb(color.value);

  const alpha=
  Number(opacity.value)/100;

  pages.forEach(function(page){

   const width=
   page.getWidth();

   const height=
   page.getHeight();

   const fs=
   Number(fontSize.value);

   const watermarkText=
   text.value ||
   "WATERMARK";

   const estimatedWidth=
   watermarkText.length*
   fs*.52;

   let x=
   (width-estimatedWidth)/2;

   let y=
   height/2;

   if(position.value==="top"){

    y=
    height-fs-30;

   }

   if(position.value==="bottom"){

    y=30;

   }

   page.drawText(
    watermarkText,
    {
     x:x,
     y:y,
     size:fs,
     color:PDFLib.rgb(
      rgb.r,
      rgb.g,
      rgb.b
     ),
     opacity:alpha,
     rotate:PDFLib.degrees(
      Number(rotation.value)
     )
    }
   );

  });


  const result=
  await pdfDoc.save();


  const blob=
  new Blob(
   [result],
   {type:"application/pdf"}
  );


  const url=
  URL.createObjectURL(blob);


  download.href=url;

  download.download=
  selectedFile.name.replace(
   /\.pdf$/i,
   ""
  )+"-watermarked.pdf";

  download.style.display=
  "block";

  status.textContent=
  "✓ Watermark added successfully.";


 }catch(error){

  console.error(error);

  status.textContent=
  "Unable to process the PDF.";

 }


 process.disabled=false;

 process.textContent=
 "Apply Watermark";

};


reset.onclick=function(){

 selectedFile=null;

 fileInput.value="";

 workspace.style.display=
 "none";

 download.style.display=
 "none";

 status.textContent="";

};


updatePreview();

</script>

</body>
</html>
