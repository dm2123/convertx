<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"
></script>

<script>
"use strict";

/* =========================================================
   ConvertX PDF Compressor
   Fixed version:
   - Prevents detached ArrayBuffer errors
   - Fresh PDF.js buffer for every attempt
   - Supports KB / MB / GB target
   - Quality control
   - DPI control
   - Grayscale mode
   - Page range
   - Auto target
   - Download result
========================================================= */

const PDFJS_URL =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

const PDFJS_WORKER =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

/* =========================================================
   DOM
========================================================= */

const dropZone =
document.getElementById("dropZone");

const chooseBtn =
document.getElementById("chooseBtn");

const fileInput =
document.getElementById("fileInput");

const filePanel =
document.getElementById("filePanel");

const fileName =
document.getElementById("fileName");

const fileMeta =
document.getElementById("fileMeta");

const removeBtn =
document.getElementById("removeBtn");

const originalSize =
document.getElementById("originalSize");

const pageCount =
document.getElementById("pageCount");

const targetPreview =
document.getElementById("targetPreview");

const targetValue =
document.getElementById("targetValue");

const targetUnit =
document.getElementById("targetUnit");

const quality =
document.getElementById("quality");

const qualityValue =
document.getElementById("qualityValue");

const dpi =
document.getElementById("dpi");

const colorMode =
document.getElementById("colorMode");

const startPage =
document.getElementById("startPage");

const endPage =
document.getElementById("endPage");

const allPages =
document.getElementById("allPages");

const autoTarget =
document.getElementById("autoTarget");

const compressBtn =
document.getElementById("compressBtn");

const resetBtn =
document.getElementById("resetBtn");

const statusBox =
document.getElementById("status");

const progressPanel =
document.getElementById("progressPanel");

const progressBar =
document.getElementById("progressBar");

const progressMessage =
document.getElementById("progressMessage");

const progressPercent =
document.getElementById("progressPercent");

const progressDetail =
document.getElementById("progressDetail");

const result =
document.getElementById("result");

const resultOriginal =
document.getElementById("resultOriginal");

const resultOutput =
document.getElementById("resultOutput");

const resultReduction =
document.getElementById("resultReduction");

const resultQuality =
document.getElementById("resultQuality");

const downloadBtn =
document.getElementById("downloadBtn");

/* =========================================================
   STATE
========================================================= */

let currentFile = null;

let currentPDFBytes = null;

let currentPageCount = 0;

let currentOutputBlob = null;

let currentOutputName = "";

let busy = false;

let pdfjsLibInstance = null;

/* =========================================================
   PDF.JS LOADER
========================================================= */

async function getPDFJS(){

    if(pdfjsLibInstance){

        return pdfjsLibInstance;

    }

    try{

        const module =
        await import(
            PDFJS_URL
        );

        pdfjsLibInstance =
        module;

        return pdfjsLibInstance;

    }catch(error){

        console.error(
            "PDF.js loading error:",
            error
        );

        throw new Error(
            "PDF.js could not be loaded. Check your internet connection."
        );

    }

}

/* =========================================================
   CONFIGURE PDF.JS
========================================================= */

async function configurePDFJS(){

    const lib =
    await getPDFJS();

    if(
        lib &&
        lib.GlobalWorkerOptions
    ){

        lib.GlobalWorkerOptions.workerSrc =
        PDFJS_WORKER;

    }

    return lib;

}

/* =========================================================
   SAFE COPY
   IMPORTANT FIX FOR DETACHED ARRAYBUFFER
========================================================= */

function clonePDFBytes(
    bytes
){

    if(!bytes){

        throw new Error(
            "PDF data is unavailable."
        );

    }

    return new Uint8Array(
        bytes
    ).slice();

}

/* =========================================================
   FILE PICKER
========================================================= */

chooseBtn.addEventListener(
    "click",
    function(){

        if(busy){

            return;

        }

        fileInput.click();

    }
);

fileInput.addEventListener(
    "change",
    function(){

        if(
            this.files &&
            this.files.length
        ){

            acceptPDF(
                this.files[0]
            );

        }

        this.value = "";

    }
);

/* =========================================================
   DRAG & DROP
========================================================= */

dropZone.addEventListener(
    "dragover",
    function(event){

        event.preventDefault();

        if(busy){

            return;

        }

        dropZone.classList.add(
            "drag"
        );

    }
);

dropZone.addEventListener(
    "dragleave",
    function(){

        dropZone.classList.remove(
            "drag"
        );

    }
);

dropZone.addEventListener(
    "drop",
    function(event){

        event.preventDefault();

        dropZone.classList.remove(
            "drag"
        );

        if(busy){

            return;

        }

        if(
            event.dataTransfer &&
            event.dataTransfer.files &&
            event.dataTransfer.files.length
        ){

            acceptPDF(
                event.dataTransfer.files[0]
            );

        }

    }
);

/* =========================================================
   ACCEPT PDF
========================================================= */

async function acceptPDF(
    file
){

    if(!isPDF(file)){

        showError(
            "Please select a valid PDF file."
        );

        return;

    }

    if(
        !file.size ||
        file.size <= 0
    ){

        showError(
            "The selected PDF file is empty."
        );

        return;

    }

    currentFile =
    file;

    currentPDFBytes =
    null;

    currentPageCount =
    0;

    currentOutputBlob =
    null;

    currentOutputName =
    "";

    fileName.textContent =
    file.name;

    fileMeta.textContent =
    (
        file.type ||
        "application/pdf"
    ) +
    " • " +
    formatBytes(
        file.size
    );

    originalSize.textContent =
    formatBytes(
        file.size
    );

    pageCount.textContent =
    "Reading...";

    filePanel.style.display =
    "block";

    result.style.display =
    "none";

    progressPanel.style.display =
    "none";

    try{

        showStatus(
            "Reading PDF..."
        );

        /*
         * Read the file once.
         * Make TWO independent copies.
         *
         * One copy is retained by ConvertX.
         * Another copy is handed to PDF.js.
         */

        const rawBytes =
        new Uint8Array(
            await file.arrayBuffer()
        );

        currentPDFBytes =
        clonePDFBytes(
            rawBytes
        );

        const pdfjs =
        await configurePDFJS();

        const pdfJSBytes =
        clonePDFBytes(
            currentPDFBytes
        );

        const loadingTask =
        pdfjs.getDocument({
            data:
            pdfJSBytes
        });

        const pdf =
        await loadingTask.promise;

        currentPageCount =
        pdf.numPages;

        pageCount.textContent =
        String(
            currentPageCount
        );

        startPage.value =
        "1";

        endPage.value =
        String(
            currentPageCount
        );

        updateTargetPreview();

        showSuccess(
            "PDF loaded successfully. Choose your compression settings."
        );

        /*
         * Destroy PDF.js document after reading.
         * This releases worker resources.
         */

        try{

            if(
                pdf &&
                typeof pdf.destroy ===
                "function"
            ){

                await pdf.destroy();

            }

        }catch(cleanupError){

            console.warn(
                "PDF.js cleanup warning:",
                cleanupError
            );

        }

    }catch(error){

        console.error(
            "PDF loading error:",
            error
        );

        currentPDFBytes =
        null;

        currentPageCount =
        0;

        pageCount.textContent =
        "Error";

        showError(
            "Could not read this PDF. " +
            getErrorMessage(
                error
            )
        );

    }

}

/* =========================================================
   PDF VALIDATION
========================================================= */

function isPDF(
    file
){

    if(!file){

        return false;

    }

    const name =
    String(
        file.name ||
        ""
    ).toLowerCase();

    const type =
    String(
        file.type ||
        ""
    ).toLowerCase();

    return (
        type ===
        "application/pdf" ||
        name.endsWith(
            ".pdf"
        )
    );

}

/* =========================================================
   REMOVE FILE
========================================================= */

removeBtn.addEventListener(
    "click",
    function(){

        if(busy){

            return;

        }

        resetTool();

    }
);

/* =========================================================
   RESET
========================================================= */

resetBtn.addEventListener(
    "click",
    function(){

        if(busy){

            return;

        }

        resetTool();

    }
);

function resetTool(){

    currentFile =
    null;

    currentPDFBytes =
    null;

    currentPageCount =
    0;

    currentOutputBlob =
    null;

    currentOutputName =
    "";

    fileInput.value =
    "";

    filePanel.style.display =
    "none";

    result.style.display =
    "none";

    progressPanel.style.display =
    "none";

    originalSize.textContent =
    "—";

    pageCount.textContent =
    "—";

    targetPreview.textContent =
    "—";

    progressBar.style.width =
    "0%";

    progressPercent.textContent =
    "0%";

    progressMessage.textContent =
    "Preparing...";

    progressDetail.textContent =
    "Waiting";

    quality.value =
    "70";

    qualityValue.textContent =
    "70%";

    dpi.value =
    "120";

    startPage.value =
    "1";

    endPage.value =
    "1";

    allPages.checked =
    true;

    currentOutputName =
    "";

    updateTargetPreview();

    showStatus(
        "Select a PDF file to begin."
    );

}

/* =========================================================
   TARGET PREVIEW
========================================================= */

function updateTargetPreview(){

    if(
        !targetValue ||
        !targetUnit ||
        !targetPreview
    ){

        return;

    }

    const value =
    Number(
        targetValue.value
    );

    const unit =
    targetUnit.value;

    if(
        !Number.isFinite(
            value
        ) ||
        value <= 0
    ){

        targetPreview.textContent =
        "—";

        return;

    }

    const bytes =
    targetToBytes(
        value,
        unit
    );

    targetPreview.textContent =
    formatBytes(
        bytes
    );

}

/* =========================================================
   TARGET INPUT EVENTS
========================================================= */

if(targetValue){

    targetValue.addEventListener(
        "input",
        updateTargetPreview
    );

}

if(targetUnit){

    targetUnit.addEventListener(
        "change",
        updateTargetPreview
    );

}

if(quality){

    quality.addEventListener(
        "input",
        function(){

            qualityValue.textContent =
            quality.value +
            "%";

        }
    );

}

/* =========================================================
   QUICK TARGET BUTTONS
========================================================= */

document
.querySelectorAll(
    ".quick-target"
)
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                if(busy){

                    return;

                }

                const value =
                button.dataset.value;

                const unit =
                button.dataset.unit;

                if(targetValue){

                    targetValue.value =
                    value;

                }

                if(targetUnit){

                    targetUnit.value =
                    unit;

                }

                updateTargetPreview();

            }
        );

    }
);

/* =========================================================
   ALL PAGES
========================================================= */

if(allPages){

    allPages.addEventListener(
        "change",
        function(){

            const disabled =
            allPages.checked;

            if(startPage){

                startPage.disabled =
                disabled;

            }

            if(endPage){

                endPage.disabled =
                disabled;

            }

        }
    );

}

/* =========================================================
   COMPRESS BUTTON
========================================================= */

compressBtn.addEventListener(
    "click",
    async function(){

        if(busy){

            return;

        }

        if(
            !currentFile ||
            !currentPDFBytes
        ){

            showError(
                "Please select a PDF file first."
            );

            return;

        }

        if(
            !currentPageCount ||
            currentPageCount < 1
        ){

            showError(
                "PDF page count is unavailable."
            );

            return;

        }

        busy =
        true;

        setBusyState(
            true
        );

        progressPanel.style.display =
        "block";

        result.style.display =
        "none";

        currentOutputBlob =
        null;

        try{

            const pages =
            getSelectedPages();

            const selectedDPI =
            Number(
                dpi.value
            ) || 120;

            const baseQuality =
            Number(
                quality.value
            ) || 70;

            const grayscale =
            colorMode.value ===
            "grayscale";

            const targetBytes =
            targetToBytes(
                Number(
                    targetValue.value
                ),
                targetUnit.value
            );

            let resultData;

            if(
                autoTarget &&
                autoTarget.checked
            ){

                showStatus(
                    "Finding the best compression for your target size..."
                );

                resultData =
                await compressWithTargetSearch({

                    pages:
                    pages,

                    targetBytes:
                    targetBytes,

                    baseQuality:
                    baseQuality,

                    selectedDPI:
                    selectedDPI,

                    grayscale:
                    grayscale

                });

            }else{

                showStatus(
                    "Compressing PDF..."
                );

                resultData =
                await buildCompressedPDF({

                    pages:
                    pages,

                    jpegQuality:
                    baseQuality / 100,

                    dpi:
                    selectedDPI,

                    grayscale:
                    grayscale,

                    attempt:
                    1,

                    totalAttempts:
                    1

                });

            }

            if(
                !resultData ||
                !resultData.blob
            ){

                throw new Error(
                    "Compression produced no output."
                );

            }

            currentOutputBlob =
            resultData.blob;

            currentOutputName =
            createOutputName(
                currentFile.name
            );

            displayResult(
                resultData
            );

            showSuccess(
                "Compression complete. Click Download PDF."
            );

        }catch(error){

            console.error(
                "Compression error:",
                error
            );

            showError(
                "Compression failed: " +
                getErrorMessage(
                    error
                )
            );

        }finally{

            busy =
            false;

            setBusyState(
                false
            );

        }

    }
);

/* =========================================================
   GET SELECTED PAGES
========================================================= */

function getSelectedPages(){

    if(
        !currentPageCount ||
        currentPageCount < 1
    ){

        throw new Error(
            "PDF page count is unavailable."
        );

    }

    if(
        allPages &&
        allPages.checked
    ){

        return Array.from(
            {
                length:
                currentPageCount
            },
            function(_,index){

                return index + 1;

            }
        );

    }

    const start =
    Number(
        startPage.value
    );

    const end =
    Number(
        endPage.value
    );

    if(
        !Number.isInteger(
            start
        ) ||
        !Number.isInteger(
            end
        )
    ){

        throw new Error(
            "Enter valid start and end page numbers."
        );

    }

    if(start < 1){

        throw new Error(
            "Start page cannot be less than 1."
        );

    }

    if(end < start){

        throw new Error(
            "End page must be greater than or equal to start page."
        );

    }

    if(
        end >
        currentPageCount
    ){

        throw new Error(
            "End page is greater than the PDF page count."
        );

    }

    const pages = [];

    for(
        let page = start;
        page <= end;
        page++
    ){

        pages.push(
            page
        );

    }

    return pages;

}

/* =========================================================
   TARGET SIZE SEARCH
========================================================= */

async function compressWithTargetSearch(
    options
){

    const target =
    options.targetBytes;

    if(
        !Number.isFinite(
            target
        ) ||
        target <= 0
    ){

        throw new Error(
            "Enter a valid target size."
        );

    }

    const candidates =
    createQualityCandidates(
        options.baseQuality
    );

    let bestResult =
    null;

    for(
        let i = 0;
        i < candidates.length;
        i++
    ){

        const qualityValue =
        candidates[i];

        setProgress(
            5 +
            Math.round(
                (
                    i /
                    candidates.length
                ) *
                80
            ),
            "Testing compression " +
            (i + 1) +
            " of " +
            candidates.length
        );

        const candidate =
        await buildCompressedPDF({

            pages:
            options.pages,

            jpegQuality:
            qualityValue,

            dpi:
            options.selectedDPI,

            grayscale:
            options.grayscale,

            attempt:
            i + 1,

            totalAttempts:
            candidates.length

        });

        if(!bestResult){

            bestResult =
            candidate;

        }

        if(
            candidate.blob.size <=
            target
        ){

            bestResult =
            candidate;

            break;

        }

        if(
            candidate.blob.size <
            bestResult.blob.size
        ){

            bestResult =
            candidate;

        }

        /*
         * Give browser time to release
         * temporary objects between attempts.
         */

        await yieldToBrowser();

        await yieldToBrowser();

    }

    if(!bestResult){

        throw new Error(
            "Could not create a compressed PDF."
        );

    }

    return bestResult;

}

/* =========================================================
   QUALITY CANDIDATES
========================================================= */

function createQualityCandidates(
    baseQuality
){

    const base =
    Math.max(
        0.20,
        Math.min(
            1,
            baseQuality / 100
        )
    );

    const candidates = [

        base,

        base - 0.08,

        base - 0.16,

        base - 0.24,

        base - 0.32,

        0.55,

        0.48,

        0.42,

        0.36,

        0.30,

        0.25,

        0.20

    ];

    const unique = [];

    for(
        let i = 0;
        i < candidates.length;
        i++
    ){

        const value =
        Math.max(
            0.20,
            Math.min(
                1,
                candidates[i]
            )
        );

        const rounded =
        Math.round(
            value * 100
        ) / 100;

        if(
            !unique.includes(
                rounded
            )
        ){

            unique.push(
                rounded
            );

        }

    }

    return unique;

}

/* =========================================================
   BUILD COMPRESSED PDF
========================================================= */

async function buildCompressedPDF(
    options
){

    setProgress(
        8,
        "Loading PDF engine..."
    );

    const pdfjs =
    await configurePDFJS();

    if(
        !window.PDFLib
    ){

        throw new Error(
            "PDF-LIB could not be loaded. Check your internet connection."
        );

    }

    const PDFDocument =
    window.PDFLib.PDFDocument;

    const pdfDoc =
    await PDFDocument.create();

    /*
     * CRITICAL:
     *
     * NEVER pass currentPDFBytes directly to PDF.js.
     *
     * PDF.js may transfer the underlying ArrayBuffer
     * to its worker. After that the original buffer
     * can become detached.
     *
     * Every attempt gets a fresh clone.
     */

    const safePDFBytes =
    clonePDFBytes(
        currentPDFBytes
    );

    const loadingTask =
    pdfjs.getDocument({

        data:
        safePDFBytes,

        /*
         * Keep worker processing isolated.
         */

        useWorkerFetch:
        false,

        isEvalSupported:
        true

    });

    const sourcePDF =
    await loadingTask.promise;

    const total =
    options.pages.length;

    try{

        for(
            let index = 0;
            index < total;
            index++
        ){

            const pageNumber =
            options.pages[index];

            const percent =
            10 +
            Math.round(
                (
                    index /
                    total
                ) *
                80
            );

            setProgress(
                percent,
                "Rendering page " +
                pageNumber +
                " of " +
                currentPageCount
            );

            setProgressDetail(
                "Quality: " +
                Math.round(
                    options.jpegQuality *
                    100
                ) +
                "% • DPI: " +
                options.dpi
            );

            const pdfPage =
            await sourcePDF.getPage(
                pageNumber
            );

            const viewport =
            createViewport(
                pdfPage,
                options.dpi
            );

            const canvas =
            document.createElement(
                "canvas"
            );

            const context =
            canvas.getContext(
                "2d",
                {
                    alpha:
                    false,
                    willReadFrequently:
                    false
                }
            );

            canvas.width =
            Math.max(
                1,
                Math.ceil(
                    viewport.width
                )
            );

            canvas.height =
            Math.max(
                1,
                Math.ceil(
                    viewport.height
                )
            );

            if(!context){

                throw new Error(
                    "Browser could not create a canvas."
                );

            }

            context.fillStyle =
            options.grayscale
            ? "#ffffff"
            : "#ffffff";

            context.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            await pdfPage.render({

                canvasContext:
                context,

                viewport:
                viewport

            }).promise;

            /*
             * Convert rendered page to JPEG.
             */

            const jpegBlob =
            await canvasToJPEG(
                canvas,
                options.jpegQuality
            );

            const jpegBytes =
            new Uint8Array(
                await jpegBlob.arrayBuffer()
            );

            const image =
            await pdfDoc.embedJpg(
                jpegBytes
            );

            const page =
            pdfDoc.addPage([
                viewport.width,
                viewport.height
            ]);

            page.drawImage(
                image,
                {

                    x:
                    0,

                    y:
                    0,

                    width:
                    viewport.width,

                    height:
                    viewport.height

                }
            );

            /*
             * Release references immediately.
             */

            canvas.width =
            1;

            canvas.height =
            1;

            await yieldToBrowser();

        }

    }finally{

        /*
         * Always destroy PDF.js document,
         * even when rendering fails.
         */

        try{

            if(
                sourcePDF &&
                typeof sourcePDF.destroy ===
                "function"
            ){

                await sourcePDF.destroy();

            }

        }catch(cleanupError){

            console.warn(
                "PDF.js destroy warning:",
                cleanupError
            );

        }

    }

    setProgress(
        92,
        "Creating final PDF..."
    );

    setProgressDetail(
        "Writing compressed PDF..."
    );

    const outputBytes =
    await pdfDoc.save({

        useObjectStreams:
        true,

        addDefaultPage:
        false,

        objectsPerTick:
        50

    });

    const blob =
    new Blob(
        [
            outputBytes
        ],
        {
            type:
            "application/pdf"
        }
    );

    setProgress(
        100,
        "Compression finished"
    );

    setProgressDetail(
        formatBytes(
            blob.size
        )
    );

    return {

        blob:
        blob,

        quality:
        Math.round(
            options.jpegQuality *
            100
        ),

        dpi:
        options.dpi,

        pages:
        options.pages.length

    };

}

/* =========================================================
   CREATE VIEWPORT
========================================================= */

function createViewport(
    pdfPage,
    dpiValue
){

    const safeDPI =
    Math.max(
        36,
        Math.min(
            600,
            Number(
                dpiValue
            ) || 120
        )
    );

    const scale =
    safeDPI /
    72;

    return pdfPage.getViewport({

        scale:
        scale

    });

}

/* =========================================================
   CANVAS JPEG
========================================================= */

function canvasToJPEG(
    canvas,
    qualityValue
){

    return new Promise(
        function(resolve,reject){

            canvas.toBlob(
                function(blob){

                    if(!blob){

                        reject(
                            new Error(
                                "Browser failed to encode JPEG."
                            )
                        );

                        return;

                    }

                    resolve(
                        blob
                    );

                },
                "image/jpeg",
                Math.max(
                    0.20,
                    Math.min(
                        1,
                        qualityValue
                    )
                )
            );

        }
    );

}

/* =========================================================
   TARGET BYTES
========================================================= */

function targetToBytes(
    value,
    unit
){

    const number =
    Number(
        value
    );

    if(
        !Number.isFinite(
            number
        ) ||
        number <= 0
    ){

        return 0;

    }

    const normalized =
    String(
        unit ||
        "MB"
    ).toUpperCase();

    if(
        normalized ===
        "KB"
    ){

        return (
            number *
            1024
        );

    }

    if(
        normalized ===
        "GB"
    ){

        return (
            number *
            1024 *
            1024 *
            1024
        );

    }

    return (
        number *
        1024 *
        1024
    );

}

/* =========================================================
   RESULT
========================================================= */

function displayResult(
    resultData
){

    const original =
    currentFile.size;

    const output =
    resultData.blob.size;

    const reduction =
    original > 0
    ? (
        (
            original -
            output
        ) /
        original
    ) *
    100
    : 0;

    resultOriginal.textContent =
    formatBytes(
        original
    );

    resultOutput.textContent =
    formatBytes(
        output
    );

    if(reduction >= 0){

        resultReduction.textContent =
        reduction.toFixed(
            1
        ) +
        "%";

    }else{

        resultReduction.textContent =
        "Output larger";

    }

    resultQuality.textContent =
    resultData.quality +
    "% / " +
    resultData.dpi +
    " DPI";

    result.style.display =
    "block";

}

        );

);

/* =========================================================
   OUTPUT NAME
========================================================= */

function createOutputName(
    originalName
){

    const clean =
    String(
        originalName ||
        "document.pdf"
    )
    .replace(
        /\.pdf$/i,
        ""
    )
    .replace(
        /[\\/:*?"<>|]/g,
        "_"
    );

    return (
        clean +
        "-compressed.pdf"
    );

}

/* =========================================================
   DOWNLOAD BLOB
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
    URL.createObjectURL(
        blob
    );

    const anchor =
    document.createElement(
        "a"
    );

    anchor.href =
    url;

    anchor.download =
    filename;

    anchor.style.display =
    "none";

    document.body.appendChild(
        anchor
    );

    anchor.click();

    anchor.remove();

    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        3000
    );

}

function setProgress(

            Number(
                value
            ) || 0
        )
    );

    progressBar.style.width =
    safeValue +

    ) +

}

/* =========================================================
   FORMAT BYTES
========================================================= */

function formatBytes(
    bytes
){

    if(
        !Number.isFinite(
            bytes
        )
    ){

        return "—";

    }

    if(bytes < 1024){

        return (
            Math.round(
                bytes
            ) +
            " B"
        );

    }

    if(
        bytes <
        1024 * 1024
    ){

        return (
            (
                bytes /
                1024
            ).toFixed(
                1
            ) +
            " KB"
        );

    }

    if(
        bytes <
        1024 *
        1024 *
        1024
    ){

        return (
            (
                bytes /
                1024 /
                1024
            ).toFixed(
                2
            ) +
            " MB"
        );

    }

    return (
        (
            bytes /
            1024 /
            1024 /
            1024
        ).toFixed(
            2
        ) +
        " GB"
    );

}

/* =========================================================
   ERROR MESSAGE
========================================================= */

function getErrorMessage(
    error
){

    if(!error){

        return "Unknown error.";

    }

    if(
        typeof error ===
        "string"
    ){

        return error;

    }

    if(error.message){

        return error.message;

    }

    return String(
        error
    );

}

/* =========================================================
   YIELD
========================================================= */

function yieldToBrowser(){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                0
            );

        }
    );

}
