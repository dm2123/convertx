<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Add page numbers to PDF files online with ConvertX.">
<title>PDF Page Number - ConvertX</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#06070d;
 --panel:#0d0f18;
 --panel2:#11131e;
 --border:#ffffff14;
 --text:#f5f7ff;
 --muted:#8d91a3;
 --accent:#8b6cff;
 --accent2:#35a9ff;
}

body{
 margin:0;
 background:
 radial-gradient(circle at 10% 0%,#30205b55,transparent 35%),
 radial-gradient(circle at 90% 10%,#123a5555,transparent 35%),
 var(--bg);
 color:var(--text);
 font-family:Inter,Arial,sans-serif;
}

.container{
 width:min(1100px,92%);
 margin:auto;
}

.nav{
 margin:20px 0;
 padding:15px 18px;
 border:1px solid var(--border);
 border-radius:20px;
 background:#ffffff06;
 backdrop-filter:blur(20px);
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:#fff;
 text-decoration:none;
 font-size:21px;
 font-weight:900;
}

.back{
 color:var(--muted);
 text-decoration:none;
 font-size:13px;
}

.hero{
 text-align:center;
 padding:55px 0 38px;
}

.badge{
 display:inline-block;
 padding:8px 13px;
 border-radius:999px;
 color:#c6baff;
 background:#8b6cff12;
 border:1px solid #8b6cff30;
 font-size:11px;
 font-weight:800;
}

h1{
 margin:20px 0 12px;
 font-size:clamp(42px,7vw,70px);
 letter-spacing:-4px;
}

.gradient{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text;
 color:transparent;
}

.subtitle{
 max-width:700px;
 margin:auto;
 color:var(--muted);
 line-height:1.7;
}

.tool{
 padding:14px;
 border:1px solid var(--border);
 border-radius:27px;
 background:#ffffff05;
}

.upload{
 min-height:290px;
 border:2px dashed #ffffff22;
 border-radius:20px;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 cursor:pointer;
}

.upload:hover{
 border-color:var(--accent);
 background:#8b6cff08;
}

.upload-icon{
 font-size:50px;
 margin-bottom:12px;
}

.upload h2{
 margin:5px 0 8px;
}

.upload p{
 color:#777c90;
 font-size:13px;
}

.primary{
 border:0;
 border-radius:11px;
 padding:13px 20px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 color:white;
 font-weight:800;
 cursor:pointer;
}

.primary:disabled{
 opacity:.5;
 cursor:not-allowed;
}

input[type=file]{
 display:none;
}

.workspace{
 display:none;
 margin-top:18px;
}

.grid{
 display:grid;
 grid-template-columns:300px 1fr;
 gap:15px;
}

.controls{
 padding:20px;
 border:1px solid var(--border);
 border-radius:20px;
 background:#ffffff05;
}

.section-title{
 font-size:11px;
 color:#a3a7b8;
 font-weight:900;
 letter-spacing:.7px;
 margin:0 0 14px;
}

.field{
 margin-bottom:17px;
}

.field label{
 display:block;
 font-size:11px;
 color:#9ca0b1;
 margin-bottom:7px;
}

select,
input[type=number],
input[type=text],
input[type=color]{
 width:100%;
 padding:11px;
 border-radius:10px;
 border:1px solid var(--border);
 background:#0b0d15;
 color:#fff;
 outline:none;
}

input[type=color]{
 height:44px;
 padding:4px;
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.preview{
 min-height:520px;
 padding:18px;
 border:1px solid var(--border);
 border-radius:20px;
 background:#0b0d15;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:auto;
}

.page{
 position:relative;
 background:#fff;
 color:#111;
 box-shadow:0 15px 40px #0008;
 width:min(500px,90%);
 aspect-ratio:8.27/11.69;
 padding:50px;
}

.fake-lines{
 margin-top:30px;
}

.fake-line{
 height:7px;
 background:#d5d5d5;
 margin-bottom:16px;
 border-radius:5px;
}

.fake-line:nth-child(2){width:90%}
.fake-line:nth-child(3){width:70%}
.fake-line:nth-child(4){width:95%}
.fake-line:nth-child(5){width:80%}
.fake-line:nth-child(6){width:88%}

.number-preview{
 position:absolute;
 font-size:14px;
 font-weight:700;
}

.top-left{top:18px;left:25px}
.top-center{top:18px;left:50%;transform:translateX(-50%)}
.top-right{top:18px;right:25px}
.bottom-left{bottom:18px;left:25px}
.bottom-center{bottom:18px;left:50%;transform:translateX(-50%)}
.bottom-right{bottom:18px;right:25px}

.actions{
 margin-top:15px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.download{
 display:none;
 text-align:center;
 text-decoration:none;
 grid-column:1/-1;
}

.status{
 margin-top:13px;
 color:#8d91a3;
 font-size:12px;
 text-align:center;
}

@media(max-width:800px){
 .grid{grid-template-columns:1fr}
 .preview{min-height:400px}
 h1{letter-spacing:-3px}
}
</style>
</head>

<body>

<div class="container">

<header class="nav">
<a href="index.html" class="logo">↻ ConvertX</a>
<a href="index.html" class="back">← All Tools</a>
</header>

<section class="hero">

<span class="badge">PDF EDITOR</span>

<h1>
Add <span class="gradient">Page Numbers</span>
</h1>

<p class="subtitle">
Add professional page numbers to your PDF documents
with customizable position, starting number and format.
</p>

</section>

<div class="tool">

<div class="upload" id="upload">

<div>

<div class="upload-icon">🔢</div>

<h2>Drop your PDF here</h2>

<p>Choose a PDF document to add page numbers</p>

<button class="primary" id="choose">
Choose PDF
</button>

</div>

</div>

<input type="file" id="file" accept="application/pdf">

<div class="workspace" id="workspace">

<div class="grid">

<div class="controls">

<p class="section-title">PAGE NUMBER SETTINGS</p>

<div class="field">

<label>POSITION</label>

<select id="position">

<option value="bottom-center">Bottom Center</option>
<option value="bottom-left">Bottom Left</option>
<option value="bottom-right">Bottom Right</option>
<option value="top-center">Top Center</option>
<option value="top-left">Top Left</option>
<option value="top-right">Top Right</option>

</select>

</div>

<div class="field">

<label>START NUMBER</label>

<input
type="number"
id="start"
value="1"
min="0"
>

</div>

<div class="field">

<label>FORMAT</label>

<select id="format">

<option value="number">1</option>
<option value="page">Page 1</option>
<option value="of">1 / 10</option>
<option value="pageof">Page 1 of 10</option>

</select>

</div>

<div class="field">

<label>FONT SIZE</label>

<input
type="number"
id="fontSize"
value="12"
min="6"
max="50"
>

</div>

<div class="field">

<label>TEXT COLOR</label>

<input
type="color"
id="color"
value="#222222"
>

</div>

<button
class="primary"
id="process"
style="width:100%">
Add Page Numbers
</button>

<div class="status" id="status"></div>

<div class="actions">

<button
class="primary"
id="reset">
Reset
</button>

<a
class="primary download"
id="download">
Download PDF
</a>

</div>

</div>

<div class="preview">

<div class="page">

<div
class="number-preview bottom-center"
id="numberPreview">
1
</div>

<div class="fake-lines">

<div class="fake-line"></div>
<div class="fake-line"></div>
<div class="fake-line"></div>
<div class="fake-line"></div>
<div class="fake-line"></div>
<div class="fake-line"></div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>

const upload=document.getElementById("upload");
const choose=document.getElementById("choose");
const fileInput=document.getElementById("file");
const workspace=document.getElementById("workspace");

const position=document.getElementById("position");
const start=document.getElementById("start");
const format=document.getElementById("format");
const fontSize=document.getElementById("fontSize");
const color=document.getElementById("color");

const numberPreview=document.getElementById("numberPreview");

const process=document.getElementById("process");
const reset=document.getElementById("reset");
const download=document.getElementById("download");
const status=document.getElementById("status");

let selectedFile=null;

choose.onclick=function(e){
 e.stopPropagation();
 fileInput.click();
};

upload.onclick=function(){
 fileInput.click();
};

fileInput.onchange=function(){
 if(this.files[0]){
  selectedFile=this.files[0];
  workspace.style.display="block";
  updatePreview();
 }
};

[position,start,format,fontSize,color].forEach(function(el){
 el.addEventListener("input",updatePreview);
 el.addEventListener("change",updatePreview);
});

function getText(pageNo,total){

 let n=Number(start.value)+pageNo-1;

 if(format.value==="number") return String(n);

 if(format.value==="page")
  return "Page "+n;

 if(format.value==="of")
  return n+" / "+total;

 return "Page "+n+" of "+total;
}

function updatePreview(){

 let p=position.value;

 numberPreview.className=
 "number-preview "+p;

 numberPreview.textContent=
 getText(1,10);

 numberPreview.style.fontSize=
 fontSize.value+"px";

 numberPreview.style.color=
 color.value;
}

process.onclick=async function(){

 if(!selectedFile){
  alert("Please select a PDF first.");
  return;
 }

 process.disabled=true;
 process.textContent="Processing...";
 status.textContent="Loading PDF...";

 try{

  const bytes=
  await selectedFile.arrayBuffer();

  const pdfDoc=
  await PDFLib.PDFDocument.load(bytes);

  const pages=
  pdfDoc.getPages();

  const total=
  pages.length;

  const rgb=
  PDFLib.rgb;

  let r=parseInt(color.value.slice(1,3),16)/255;
  let g=parseInt(color.value.slice(3,5),16)/255;
  let b=parseInt(color.value.slice(5,7),16)/255;

  pages.forEach(function(page,index){

   const size=page.getSize();

   const text=
   getText(index+1,total);

   const fs=
   Number(fontSize.value);

   const margin=24;

   const width=
   page.getWidth();

   const height=
   page.getHeight();

   const textWidth=
   fs*text.length*.52;

   let x=margin;
   let y=margin;

   switch(position.value){

    case "bottom-center":
     x=(width-textWidth)/2;
     y=margin;
     break;

    case "bottom-right":
     x=width-textWidth-margin;
     y=margin;
     break;

    case "bottom-left":
     x=margin;
     y=margin;
     break;

    case "top-center":
     x=(width-textWidth)/2;
     y=height-margin-fs;
     break;

    case "top-right":
     x=width-textWidth-margin;
     y=height-margin-fs;
     break;

    case "top-left":
     x=margin;
     y=height-margin-fs;
     break;
   }

   page.drawText(text,{
    x:x,
    y:y,
    size:fs,
    color:rgb(r,g,b)
   });

  });

  status.textContent=
  "✓ Page numbers added successfully.";

  const result=
  await pdfDoc.save();

  const blob=
  new Blob(
   [result],
   {type:"application/pdf"}
  );

  const url=
  URL.createObjectURL(blob);

  download.href=url;

  download.download=
  selectedFile.name.replace(
   /\.pdf$/i,
   ""
  )+"-numbered.pdf";

  download.style.display="block";

 }catch(error){

  console.error(error);

  status.textContent=
  "Unable to process this PDF.";

 }

 process.disabled=false;
 process.textContent="Add Page Numbers";
};

reset.onclick=function(){

 selectedFile=null;
 fileInput.value="";
 workspace.style.display="none";
 download.style.display="none";
 status.textContent="";

};

updatePreview();

</script>

</body>
</html>
