<body>

<div class="container">

<a class="back" href="index.html">
← Back to ConvertX
</a>

<h1>↔️ Image Resizer</h1>

<div class="subtitle">
Resize images to exact dimensions while optionally keeping their aspect ratio.
</div>

<div class="card">

<div class="drop" id="drop">

<div class="icon">
🖼️
</div>

<h2>Select Image</h2>

<p>
JPG, JPEG, PNG or WebP
</p>

<button
class="primary"
id="choose"
type="button">

Choose Image

</button>

<input
id="file"
type="file"
accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp">

</div>


<div class="file" id="fileInfo"></div>


<div class="dimensions">

<div class="dimension">
Original
<br>
<strong id="originalDimensions">
-
</strong>
</div>

<div class="dimension">
New
<br>
<strong id="newDimensions">
-
</strong>
</div>

</div>


<div class="grid">

<div class="field">

<label>
Width (px)
</label>

<input
id="width"
type="number"
min="1"
step="1"
placeholder="Width">

</div>


<div class="field">

<label>
Height (px)
</label>

<input
id="height"
type="number"
min="1"
step="1"
placeholder="Height">

</div>

</div>


<div class="checkbox">

<input
id="keepRatio"
type="checkbox"
checked>

<label
for="keepRatio"
style="margin:0">

Keep aspect ratio

</label>

</div>


<div class="field"
style="margin-top:18px">

<label>
Output Format
</label>

<select id="format">

<option value="image/jpeg">
JPG
</option>

<option value="image/png">
PNG
</option>

<option value="image/webp">
WebP
</option>

</select>

</div>


<div class="actions">

<button
class="secondary"
id="reset"
type="button">

Reset

</button>

<button
class="primary"
id="resize"
type="button">

↔️ Resize & Download

</button>

</div>


<div
class="preview"
id="preview">

<img
id="previewImage"
alt="Image preview">

</div>


<div
class="status"
id="status">

Select an image.

</div>


<div class="small">

All resizing happens locally in your browser.

</div>

</div>

</div>


<script>

const fileInput=
document.getElementById("file");

const choose=
document.getElementById("choose");

const drop=
document.getElementById("drop");

const fileInfo=
document.getElementById("fileInfo");

const widthInput=
document.getElementById("width");

const heightInput=
document.getElementById("height");

const keepRatio=
document.getElementById("keepRatio");

const format=
document.getElementById("format");

const resizeButton=
document.getElementById("resize");

const resetButton=
document.getElementById("reset");

const status=
document.getElementById("status");

const preview=
document.getElementById("preview");

const previewImage=
document.getElementById("previewImage");

const originalDimensions=
document.getElementById(
"originalDimensions"
);

const newDimensions=
document.getElementById(
"newDimensions"
);


let selectedFile=null;

let imageBitmap=null;

let aspectRatio=1;


/* Choose */

choose.onclick=()=>{

fileInput.click();

};


/* File */

fileInput.onchange=()=>{

if(fileInput.files.length){

loadImage(
fileInput.files[0]
);

}

};


/* Drag */

drop.ondragover=e=>{

e.preventDefault();

drop.classList.add("drag");

};

drop.ondragleave=()=>{

drop.classList.remove("drag");

};

drop.ondrop=e=>{

e.preventDefault();

drop.classList.remove("drag");

if(e.dataTransfer.files.length){

loadImage(
e.dataTransfer.files[0]
);

}

};


/* Load */

async function loadImage(file){

if(
!file.type.startsWith("image/")
){

showError(
"Please select a valid image."
);

return;

}


selectedFile=file;


try{

imageBitmap=
await createImageBitmap(
file
);


aspectRatio=
imageBitmap.width /
imageBitmap.height;


widthInput.value=
imageBitmap.width;

heightInput.value=
imageBitmap.height;


originalDimensions.textContent=
`${imageBitmap.width} × ${imageBitmap.height}`;

newDimensions.textContent=
`${imageBitmap.width} × ${imageBitmap.height}`;


fileInfo.style.display=
"block";


fileInfo.innerHTML=
`
<strong>${escapeHTML(file.name)}</strong>
<br>
${formatBytes(file.size)}
`;


const url=
URL.createObjectURL(file);

previewImage.onload=()=>{

URL.revokeObjectURL(url);

};

previewImage.src=url;

preview.style.display=
"block";


showStatus(
"Image loaded. Enter your desired dimensions."
);

}
catch(error){

showError(
"Could not read image: "+
error.message
);

}

}


/* Width */

widthInput.oninput=()=>{

if(
keepRatio.checked &&
aspectRatio
){

const width=
Number(widthInput.value);

if(width>0){

const height=
Math.round(
width /
aspectRatio
);

heightInput.value=
height;

updateNewDimensions();

}

}

};


/* Height */

heightInput.oninput=()=>{

if(
keepRatio.checked &&
aspectRatio
){

const height=
Number(heightInput.value);

if(height>0){

const width=
Math.round(
height *
aspectRatio
);

widthInput.value=
width;

updateNewDimensions();

}

}

};


/* Change dimensions */

widthInput.addEventListener(
"change",
updateNewDimensions
);

heightInput.addEventListener(
"change",
updateNewDimensions
);


function updateNewDimensions(){

const w=
Number(widthInput.value);

const h=
Number(heightInput.value);

if(w>0 && h>0){

newDimensions.textContent=
`${w} × ${h}`;

}

}


/* Resize */

resizeButton.onclick=async()=>{

if(!imageBitmap){

showError(
"Please select an image first."
);

return;

}


const width=
Math.round(
Number(widthInput.value)
);

const height=
Math.round(
Number(heightInput.value)
);


if(
!Number.isFinite(width) ||
!Number.isFinite(height) ||
width<1 ||
height<1
){

showError(
"Please enter valid width and height."
);

return;

}


resizeButton.disabled=true;

showStatus(
"Resizing image..."
);


try{

const canvas=
document.createElement(
"canvas"
);

canvas.width=
width;

canvas.height=
height;


const ctx=
canvas.getContext(
"2d"
);


if(
format.value==="image/jpeg"
){

ctx.fillStyle=
"#ffffff";

ctx.fillRect(
0,
0,
width,
height
);

}


ctx.imageSmoothingEnabled=
true;

ctx.imageSmoothingQuality=
"high";


ctx.drawImage(
imageBitmap,
0,
0,
width,
height
);


const blob=
await new Promise(
resolve=>{

canvas.toBlob(
resolve,
format.value,
0.94
);

}
);


if(!blob){

throw new Error(
"Browser could not create the image."
);

}


let extension=
"jpg";

if(
format.value==="image/png"
){

extension="png";

}

if(
format.value==="image/webp"
){

extension="webp";

}


const base=
selectedFile.name
.replace(
/\.[^.]+$/,
""
);


download(
blob,
`${base}-${width}x${height}.${extension}`
);


showSuccess(
`Image resized to ${width} × ${height}px successfully.`
);


}
catch(error){

console.error(error);

showError(
"Resize failed: "+
error.message
);

}
finally{

resizeButton.disabled=false;

}

};


/* Reset */

resetButton.onclick=()=>{

selectedFile=null;

imageBitmap=null;

fileInput.value="";

fileInfo.style.display=
"none";

preview.style.display=
"none";

widthInput.value="";

heightInput.value="";

originalDimensions.textContent=
"-";

newDimensions.textContent=
"-";

showStatus(
"Select an image."
);

};


/* Download */

function download(blob,name){

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
3000
);

}


/* Bytes */

function formatBytes(bytes){

if(bytes<1024){

return bytes+" B";

}

if(bytes<1024*1024){

return (
bytes/1024
).toFixed(1)+" KB";

}

return (
bytes/1024/1024
).toFixed(2)+" MB";

}


/* Escape */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* Status */

function showStatus(message){

status.className=
"status";

status.textContent=
message;

}


function showSuccess(message){

status.className=
"status success";

status.textContent=
"✅ "+message;

}


function showError(message){

status.className=
"status error";

status.textContent=
"❌ "+message;

}

</script>

</body>
</html>
